<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <title>小游戏合集</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top, #f6ffed 0, #ffffff 40%, #fff 100%);
      color: #333;
    }
    .layout {
      display: flex;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 230px;
      background: #f0f5ff;
      border-right: 1px solid #d6e4ff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 16px;
    }
    .game-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .game-btn {
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: #ffffff;
      box-shadow: 0 2px 4px rgba(24, 144, 255, 0.05);
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    }
    .game-btn span {
      font-size: 18px;
      margin-right: 4px;
    }
    .game-btn:hover {
      background: #e6f7ff;
      box-shadow: 0 4px 10px rgba(24, 144, 255, 0.15);
    }
    .game-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(24, 144, 255, 0.1);
    }
    .game-btn.active {
      background: #bae7ff;
      box-shadow: 0 4px 12px rgba(24, 144, 255, 0.25);
    }
    .footer {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }
    .main-header {
      padding: 8px 16px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .main-header span {
      font-weight: 600;
    }
    #game-title {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #game-frame {
      border: none;
      width: 100%;
      flex: 1;
      min-height: 0;
      background: #000;
    }

    html,body{overflow:hidden}
    .layout{height:100vh;height:100dvh;max-height:none}
    .main{min-width:0;min-height:0;padding-bottom:env(safe-area-inset-bottom)}
    .main-header{min-height:48px;flex-shrink:0;gap:10px;padding:4px 12px;padding-top:max(4px,env(safe-area-inset-top));}
    #game-title{min-width:0;flex:1;font-size:14px}
    #game-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sidebar{flex-shrink:0;overflow-y:auto;overscroll-behavior:contain}
    .game-list{flex:0 0 auto}
    .game-btn{min-height:44px;flex-shrink:0;touch-action:manipulation}
    .menu-toggle,.menu-close{border:1px solid #d6e4ff;background:#f0f5ff;color:#21436d;border-radius:8px;min-height:40px;min-width:44px;padding:7px 12px;font:inherit;cursor:pointer;touch-action:manipulation}
    .menu-close{display:none}
    .menu-backdrop{display:none}
    [hidden]{display:none!important}
    button:focus-visible{outline:2px solid #1677ff;outline-offset:2px}
    @media(max-width:900px),(pointer:coarse){
      .sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);height:100%;z-index:20;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));box-shadow:8px 0 32px #15294a35}
      .sidebar .title{padding-right:48px;margin-bottom:12px}
      .menu-close{display:block;position:absolute;right:12px;top:max(10px,env(safe-area-inset-top));padding:6px}
      .menu-backdrop{display:block;position:fixed;inset:0;z-index:19;border:0;background:#12223980;padding:0;touch-action:manipulation}
      .game-btn{min-height:48px;padding:12px}
      .main-header{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
      .footer{margin-top:auto;padding-top:16px}
    }

    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="game-sidebar" aria-label="游戏菜单">
        <button class="menu-close" id="menu-close" aria-label="关闭游戏菜单">×</button>
        <div class="title">小游戏合集 🎮</div>

        <div class="game-list">
            <button class="game-btn active" data-src="game2048.html" data-title="2048">
                <div><span>🔢</span>2048</div>
                <small>2048</small>
            </button>

            <button class="game-btn" data-src="link-game.html" data-title="连连看">
                  <div><span>🧩</span>连连看</div>
                  <small>Match</small>
            </button>

            <button class="game-btn" data-src="goldmine.html" data-title="贪吃的蛇">
                <div><span>🐍</span>贪吃的蛇</div>
                <small>Snake</small>
            </button>

            <button class="game-btn" data-src="jump.html" data-title="doodle jump">
                <div><span>🦘</span>肚兜酱噗</div>
                <small>Jump</small>
            </button>

            <button class="game-btn" data-src="魏晋事业/mine5.html" data-title="深处有光">
                <div><span>⛏️</span>深处有光</div>
                <small>地牢探险</small>
            </button>

            <button class="game-btn" data-src="slot-demo.html" data-title="保卫哨塔">
                <div><span>🏯</span>保卫哨塔</div>
                <small>保卫哨塔</small>
            </button>

        </div>

        <div class="footer">
            鸣谢:茄特-既皮体。
        </div>
    </aside>

    <button class="menu-backdrop" id="menu-backdrop" aria-label="关闭游戏菜单" tabindex="-1" hidden></button>
    <main class="main">
        <div class="main-header">
            <button class="menu-toggle" id="menu-toggle" aria-controls="game-sidebar" aria-expanded="false">☰ 游戏</button>
            <div id="game-title">
                <span>🔢 2048</span>
            </div>

        </div>
        <iframe id="game-frame" src="game2048.html" title="2048" allow="fullscreen"></iframe>
    </main>
</div>

<script>
    const buttons = document.querySelectorAll(".game-btn");
    const frame = document.getElementById("game-frame");
    const gameTitle = document.getElementById("game-title");

    const sidebar=document.getElementById('game-sidebar'),menuToggle=document.getElementById('menu-toggle'),menuClose=document.getElementById('menu-close'),backdrop=document.getElementById('menu-backdrop');
    const compact=matchMedia('(max-width:900px), (pointer:coarse)');
    let mobileOpen=false,desktopOpen=true;
    function renderMenu(){const open=compact.matches?mobileOpen:desktopOpen;sidebar.hidden=!open;sidebar.inert=!open;menuToggle.setAttribute('aria-expanded',String(open));backdrop.hidden=!(compact.matches&&open);frame.inert=compact.matches&&open;}
    function closeMenu(){if(compact.matches)mobileOpen=false;else desktopOpen=false;renderMenu();menuToggle.focus({preventScroll:true});}
    menuToggle.addEventListener('click',()=>{if(compact.matches)mobileOpen=!mobileOpen;else desktopOpen=!desktopOpen;renderMenu();if(compact.matches&&mobileOpen)menuClose.focus({preventScroll:true});});
    menuClose.addEventListener('click',closeMenu);backdrop.addEventListener('click',closeMenu);
    document.addEventListener('keydown',e=>{if(!compact.matches||!mobileOpen)return;if(e.key==='Escape'){e.preventDefault();closeMenu();}if(e.key==='Tab'){const items=[...sidebar.querySelectorAll('button')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
    compact.addEventListener('change',()=>{mobileOpen=false;renderMenu();});renderMenu();
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        const src = btn.getAttribute("data-src");
        const title = btn.getAttribute("data-title");
        const emoji = btn.querySelector("span")?.textContent || "🎮";

        if(frame.getAttribute("src")!==src)frame.src = src;
        frame.title=title;
        if(compact.matches)closeMenu();
        gameTitle.innerHTML = `<span>${emoji} ${title}</span>`;
      });
    });

</script>
</body>
</html>
