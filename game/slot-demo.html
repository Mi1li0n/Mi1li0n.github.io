<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老虎机 × 战斗 Demo</title>
<style>
:root{--bg:#0e0f1c;--panel:#181a2e;--panel2:#20233b;--line:#2e3148;--gold:#ffcf4d;--gold-dim:#9c7a26;--text:#e8e8f0;--dim:#8b90a8;--accent:#5b8cff;--good:#4ade80;--bad:#f87171;--temp:#b06bff}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1c1f3a,var(--bg));color:var(--text);height:100vh;overflow:hidden}
.wrap{width:100%;height:100vh;margin:0;padding:0;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;flex-shrink:0}
.title{font-size:20px;font-weight:700}.title small{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}
.phase{padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;border:1px solid var(--line)}
.phase.rest{color:var(--good);border-color:#2a4a2e;background:#13231a}.phase.fight{color:var(--bad);border-color:#4a2a2a;background:#231313}
.stat{font-size:14px;color:var(--dim)}.stat b{color:var(--text);font-size:16px;margin-left:4px}.stat.gold b{color:var(--gold)}
.mini{margin-left:auto;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px}.mini:hover{border-color:var(--accent)}
.cols{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
@media(max-width:980px){.cols{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.main{
    position: relative;
    flex: 1; display: flex; gap: 10px; padding: 0 10px 10px; overflow: hidden; min-height: 0;
}
.side{width:300px;flex-shrink:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.side.left{
    position: absolute;
    right: 10px;
    left: auto;
    top: 0;
    bottom: 10px;
    z-index: 20;
    width: 300px;
    transition: transform .3s ease-out, opacity .3s ease-out;
}
.side.left.hide{
    transform: translateX(120%);
    opacity: 0;
    pointer-events: none;
}
.center{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;gap:8px}
.card h2{margin:0 0 12px;font-size:15px}.card h2 small{color:var(--dim);font-weight:400;font-size:12px}
.ph{font-size:13px;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between}
.slotgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:10px}
.scell{aspect-ratio:1/1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.scell.eq{border-color:var(--gold-dim);background:#2a2410}
.scell.empty{opacity:.4}
.scell .e{font-size:22px;line-height:1}.scell .l{font-size:9px;color:var(--dim)}
.spin{width:100%;padding:12px;font-size:16px;font-weight:700;color:#1a1205;background:linear-gradient(180deg,#ffe082,var(--gold));border:0;border-radius:10px;cursor:pointer;box-shadow:0 3px 0 var(--gold-dim)}
.spin:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed;box-shadow:none}
.bonds{font-size:12px;color:var(--good);line-height:1.7;min-height:20px}
.bonds b{color:var(--gold)}
.bondlist{font-size:12px;line-height:1.7}.bondlist div{margin:1px 0}
.slotgrid.shaking .scell{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}100%{transform:translateY(0) rotate(-1deg)}}
.choices{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,9,18,.72);backdrop-filter:blur(3px);z-index:50}
.choices.show{display:flex}
.cmodal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,92vw)}
.ctitle{font-size:14px;margin-bottom:14px;font-weight:600}
.cbtns{display:flex;gap:10px}
.choice{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px;min-width:0}.choice .choice-desc{font-size:10px;line-height:1.35;color:var(--dim);text-align:left;width:100%;margin-top:3px}.choice .choice-stats{font-size:10px;line-height:1.35;color:#c9d4f5;text-align:center;width:100%}
.choice:hover{border-color:var(--accent);background:#262a45}
.choice .e{font-size:26px}.choice.skip{color:var(--dim)}
.boardwrap{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.board{
    position: relative;
    height: 100%;
    aspect-ratio: 24/12;
    max-width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: radial-gradient(circle, rgba(255,255,255,.045) 1px, transparent 1px) 0 0/calc(100%/24) calc(100%/12), #101226;
}
.terr-wall{position:absolute;background:linear-gradient(180deg,#3a3f55,#23263a);border:1px solid #4a5070;border-radius:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.4);pointer-events:none}
.terr-high{position:absolute;background:repeating-linear-gradient(45deg,rgba(255,200,80,.26),rgba(255,200,80,.26) 7px,rgba(255,200,80,.09) 7px,rgba(255,200,80,.09) 14px);border:2px solid rgba(255,200,80,.72);border-radius:24% 30% 22% 28%;box-shadow:0 0 16px rgba(255,200,80,.3),inset 0 0 20px rgba(255,200,80,.18);pointer-events:none}
.terr-water{position:absolute;background:repeating-linear-gradient(90deg,rgba(15,137,218,.34),rgba(15,137,218,.34) 12px,rgba(74,190,245,.18) 12px,rgba(74,190,245,.18) 24px);border:2px solid rgba(65,194,255,.62);border-radius:8% 14% 10% 12%;box-shadow:inset 0 0 22px rgba(25,152,226,.38),0 0 10px rgba(25,152,226,.18);pointer-events:none}
.terr-land{position:absolute;background:radial-gradient(ellipse at 46% 48%,rgba(83,112,70,.82),rgba(53,72,56,.92) 68%,rgba(35,53,48,.96));border:2px solid rgba(129,157,98,.72);border-radius:18% 28% 20% 25% / 14% 18% 21% 16%;box-shadow:0 0 12px rgba(61,98,77,.35),inset 0 0 20px rgba(25,39,34,.35);pointer-events:none}
.terr-water-ring{position:absolute;background:repeating-linear-gradient(90deg,rgba(15,137,218,.34),rgba(15,137,218,.34) 12px,rgba(74,190,245,.18) 12px,rgba(74,190,245,.18) 24px);border:2px solid rgba(65,194,255,.62);border-right:0;border-radius:10% 0 0 10% / 8% 0 0 8%;clip-path:polygon(0 0,100% 0,100% 14%,18% 14%,18% 86%,100% 86%,100% 100%,0 100%);box-shadow:inset 0 0 22px rgba(25,152,226,.38),0 0 10px rgba(25,152,226,.18);pointer-events:none}
.terr-scorched{position:absolute;background:repeating-linear-gradient(145deg,rgba(123,42,30,.32),rgba(123,42,30,.32) 13px,rgba(49,25,27,.4) 13px,rgba(49,25,27,.4) 27px);border:2px solid rgba(194,69,43,.55);border-radius:8% 0 0 7%;box-shadow:inset 0 0 30px rgba(30,10,14,.62);pointer-events:none}
.watch-aura{position:absolute;border:2px solid rgba(91,215,125,.42);border-radius:50%;background:radial-gradient(circle,rgba(74,222,128,.08),transparent 68%);box-shadow:0 0 18px rgba(74,222,128,.18);pointer-events:none;z-index:1}
.rune-mark{position:absolute;border:1px solid rgba(196,120,255,.78);border-radius:50%;background:radial-gradient(circle,rgba(174,75,255,.2),transparent 68%);box-shadow:0 0 10px rgba(177,83,255,.45);pointer-events:none;z-index:4;animation:runePulse 1.2s ease-in-out infinite alternate}@keyframes runePulse{to{filter:brightness(1.45);transform:scale(1.08)}}
.green-aura{position:absolute;border-radius:50%;border:2px solid rgba(72,235,133,.58);background:radial-gradient(circle,rgba(62,220,119,.24),transparent 68%);pointer-events:none;animation:greenAura .65s ease-out forwards}@keyframes greenAura{from{transform:scale(.45);opacity:1}to{transform:scale(1.25);opacity:0}}
.laser{position:absolute;height:4px;transform-origin:0 50%;background:linear-gradient(90deg,#e2a8ff,#9e36ff,#f7d7ff);box-shadow:0 0 8px #a63cff;pointer-events:none;animation:laserTick .34s ease-out forwards;z-index:7}@keyframes laserTick{from{opacity:1;filter:brightness(1.5)}to{opacity:0;filter:brightness(.7)}}
.aim-line{position:absolute;height:1px;transform-origin:0 50%;background:repeating-linear-gradient(90deg,rgba(2,3,8,.9) 0 9px,rgba(36,41,55,.72) 9px 14px);box-shadow:0 0 2px rgba(0,0,0,.95);pointer-events:none;z-index:4;opacity:.82}.aim-line::after{content:'';position:absolute;right:-4px;top:-3px;width:7px;height:7px;border:1px solid rgba(5,6,10,.9);border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:5}
.unit{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;user-select:none;transition:left .1s linear,top .1s linear}
.board.battle .unit{transition:left .34s linear,top .34s linear}
.board.battle .unit.charging{transition:none!important;z-index:8;filter:drop-shadow(0 0 7px rgba(255,214,96,.95))}
.board.battle .unit.charging::before{content:'';position:absolute;right:68%;top:38%;width:32px;height:24%;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,219,108,.62));filter:blur(3px);transform:rotate(var(--charge-angle,0deg));transform-origin:100% 50%;pointer-events:none}
.board.battle .unit.charging .u-emoji{animation:chargeRush .22s ease-in-out infinite alternate}
@keyframes chargeRush{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.16) rotate(4deg)}}
.unit.pl{background:radial-gradient(circle at 50% 45%,rgba(91,140,255,.42),rgba(91,140,255,.06) 68%,transparent 100%)}
.unit.en{background:radial-gradient(circle at 50% 45%,rgba(248,113,113,.42),rgba(248,113,113,.06) 68%,transparent 100%)}
.unit.temp{box-shadow:0 0 0 2px var(--temp),0 0 12px rgba(176,107,255,.6)}
.unit.drag{cursor:grab}.unit.drag:active{cursor:grabbing}
.unit.stealth{filter:brightness(.4) saturate(.5);opacity:.55}
.unit.blood{transform:scale(1.25);filter:saturate(1.35);box-shadow:0 0 16px #ff3030!important;animation:bloodPulse .55s ease-in-out infinite alternate}
@keyframes bloodPulse{from{filter:saturate(1.2) brightness(.9)}to{filter:saturate(1.6) brightness(1.25)}}
.unit .u-emoji{line-height:1}
.unit .u-hp{position:absolute;top:-4px;right:-4px;font-size:10px;font-weight:700;background:#0008;border-radius:4px;padding:0 2px}
.unit .u-bar{position:absolute;left:12%;right:12%;bottom:3px;height:3px;background:#0007;border-radius:2px;overflow:hidden}
.unit .u-bar i{display:block;height:100%}
.unit.atk .u-emoji{animation:lunge .15s ease-out}
@keyframes lunge{0%{transform:translate(0,0) scale(1)}50%{transform:translate(var(--lx,0),var(--ly,0)) scale(1.3)}100%{transform:translate(0,0) scale(1)}}
.unit.hit{box-shadow:0 0 16px rgba(255,92,92,.78)!important}.unit.hit .u-emoji{animation:hurtRecoil .28s cubic-bezier(.2,.75,.25,1)}.unit.hit::after{content:'';position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(255,80,80,.1) 35%,rgba(255,54,54,.42) 62%,transparent 74%);pointer-events:none;animation:hurtAura .32s ease-out forwards}@keyframes hurtRecoil{0%{transform:translate(0) scale(1)}24%{transform:translate(-4px,1px) scale(.88)}55%{transform:translate(3px,-1px) scale(1.08)}100%{transform:translate(0) scale(1)}}@keyframes hurtAura{0%{opacity:1;transform:scale(.65)}100%{opacity:0;transform:scale(1.2)}}
.unit.reviving{filter:grayscale(.92) brightness(.48) saturate(.25)!important;opacity:.56;box-shadow:0 0 11px rgba(52,46,62,.72)!important;transition:none}.unit.reviving .u-emoji{animation:boneStill 1.1s ease-in-out infinite alternate}.unit.reviving .u-hp{color:#aaa4b0}.unit.submerged{opacity:.28;filter:hue-rotate(145deg) saturate(1.4) drop-shadow(0 0 7px #4cc9ff)}.unit.submerged .u-emoji{transform:translateY(5px) scaleY(.55)}.unit.phasing{opacity:.48;filter:drop-shadow(0 0 8px #83e6ff);pointer-events:none}.unit.backdoor{box-shadow:0 0 0 1px rgba(76,211,255,.62),0 0 12px rgba(33,184,235,.52)!important}.unit.bound-spirit{opacity:.78;filter:drop-shadow(0 0 7px rgba(158,112,255,.7));pointer-events:none}.unit.bound-spirit .u-hp,.unit.bound-spirit .u-bar{display:none}@keyframes boneStill{from{transform:scale(.96) rotate(-2deg)}to{transform:scale(1.04) rotate(2deg)}}
.death-aura{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(74,22,92,.12),rgba(28,8,39,.22) 55%,transparent 72%);border:1px dashed rgba(153,88,180,.28);box-shadow:inset 0 0 18px rgba(40,8,55,.3);z-index:1}
.plague-cloud{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(111,151,54,.46),rgba(70,101,35,.28) 52%,rgba(40,67,27,.08) 72%,transparent 76%);border:1px dashed rgba(157,205,82,.62);box-shadow:inset 0 0 22px rgba(83,128,40,.46),0 0 14px rgba(102,150,46,.24);z-index:2;animation:plagueCloudPulse .72s ease-in-out infinite alternate}@keyframes plagueCloudPulse{from{opacity:.64;filter:saturate(.8);transform:scale(.97)}to{opacity:.92;filter:saturate(1.25);transform:scale(1.03)}}
.dark-smoke{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,rgba(84,62,96,.9),rgba(17,12,24,.72) 55%,transparent 72%);filter:blur(1px);pointer-events:none;animation:darkRise .75s ease-out forwards;z-index:8}@keyframes darkRise{0%{opacity:.1;transform:translate(0,8px) scale(.45)}35%{opacity:.9}100%{opacity:0;transform:translate(var(--drift,0),-34px) scale(1.45)}}
.unit.charge-guard{box-shadow:0 0 0 2px rgba(255,215,105,.58),0 0 15px rgba(255,193,65,.4)!important}
.bench{display:flex;flex-wrap:wrap;gap:6px;height:52px;min-height:52px;max-height:52px;box-sizing:border-box;overflow-y:auto;align-content:flex-start}
.btile{width:44px;height:44px;background:var(--panel2);border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:grab;position:relative}
.btile.temp{border-color:var(--temp);box-shadow:0 0 8px rgba(176,107,255,.5)}
.btile .e-emoji{font-size:20px}
.bctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.primary{background:linear-gradient(180deg,#7aa6ff,var(--accent));color:#08111f;border:0;border-radius:9px;padding:10px 18px;font-size:15px;font-weight:700;cursor:pointer}
.primary:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:13px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.floater{position:absolute;font-size:13px;font-weight:700;pointer-events:none;text-shadow:0 1px 2px #000;animation:fu .8s ease-out forwards;z-index:6;white-space:nowrap;transform:translateX(-50%)}
@keyframes fu{0%{opacity:0;transform:translate(-50%,4px) scale(.8)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-22px) scale(1)}}
.px{position:absolute;width:6px;height:6px;border-radius:3px;transition:transform .2s linear,opacity .14s linear .08s;pointer-events:none}
.px.arrow{background:#e8c98a}.px.fire{width:9px;height:9px;background:#ff3b1a;box-shadow:0 0 10px #ff2a2a}.px.holy{background:#fff2a8;box-shadow:0 0 8px #fff2a8}.px.hurt-spark{width:7px;height:3px;border-radius:1px;background:#ff7777;box-shadow:0 0 6px #ff3d3d;transform-origin:center;transition:transform .24s ease-out,opacity .2s linear .04s}
.px.spear{width:20px;height:3px;border-radius:2px;transform-origin:0 50%;background:linear-gradient(90deg,#9c7327,#e8c98a,#fff);box-shadow:0 0 5px #e8c98a}.px.bullet{width:14px;height:3px;border-radius:2px;background:#fff2b3;box-shadow:0 0 8px #ffcb52}
.slashmark{position:absolute;width:38px;height:4px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff,#fff,transparent);transform-origin:center;transition:transform .12s ease-out,opacity .16s linear .08s;pointer-events:none;box-shadow:0 0 5px #fff}
.charge{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(#ffe0a0,#ff7a2a);box-shadow:0 0 12px #ff7a2a;transform:scale(.3);transition:transform .4s ease-in;pointer-events:none}
.fireburst{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,70,25,.55),rgba(255,40,20,.12) 60%,transparent 100%);pointer-events:none;animation:fb .42s ease-out forwards}
@keyframes fb{0%{transform:scale(.3);opacity:.95}100%{transform:scale(1.3);opacity:0}}
.beam{position:absolute;height:2px;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,242,168,.3));pointer-events:none;animation:bf .5s linear forwards}
@keyframes bf{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.halo{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,242,168,.55),transparent 70%);pointer-events:none;animation:hp .6s ease-out forwards}
.unit.blessed{box-shadow:0 0 0 2px rgba(255,238,151,.9),0 0 18px rgba(255,218,91,.82),inset 0 0 12px rgba(255,244,185,.36)!important;animation:blessedPulse .72s ease-in-out infinite alternate}
.unit.blessed::before{content:'✦';position:absolute;left:50%;top:-22px;transform:translateX(-50%);color:#fff2a8;font-size:17px;text-shadow:0 0 5px #fff,0 0 12px #ffd65a;animation:blessedStar 1.1s ease-in-out infinite}
@keyframes blessedPulse{from{filter:brightness(1);box-shadow:0 0 0 2px rgba(255,238,151,.72),0 0 11px rgba(255,218,91,.54),inset 0 0 8px rgba(255,244,185,.24)}to{filter:brightness(1.18);box-shadow:0 0 0 3px rgba(255,246,190,1),0 0 25px rgba(255,218,91,.95),inset 0 0 16px rgba(255,244,185,.45)}}
@keyframes blessedStar{0%,100%{transform:translateX(-50%) translateY(0) scale(.9);opacity:.7}50%{transform:translateX(-50%) translateY(-4px) scale(1.18);opacity:1}}
.blessing-pillar{position:absolute;width:34px;transform:translateX(-50%);pointer-events:none;z-index:7;background:linear-gradient(90deg,transparent,rgba(255,246,190,.2),rgba(255,255,239,.94),rgba(255,228,119,.36),transparent);filter:blur(.4px);animation:blessingPillar .9s ease-out forwards}
.blessing-ring{position:absolute;border:3px solid rgba(255,232,128,.92);border-radius:50%;pointer-events:none;z-index:7;box-shadow:0 0 15px rgba(255,218,91,.8),inset 0 0 12px rgba(255,245,186,.45);animation:blessingRing .9s cubic-bezier(.18,.74,.22,1) forwards}
@keyframes blessingPillar{0%{height:0;opacity:0;transform:translateX(-50%) translateY(0)}35%{height:145px;opacity:1;transform:translateX(-50%) translateY(-112px)}100%{height:165px;opacity:0;transform:translateX(-50%) translateY(-132px)}}
@keyframes blessingRing{0%{opacity:0;transform:scale(.25)}35%{opacity:1}100%{opacity:0;transform:scale(1.65)}}
@keyframes hp{0%{transform:scale(.6);opacity:0}40%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.fx-emoji{position:absolute;pointer-events:none;transform:translate(-50%,-50%);animation:fe .5s ease-out forwards;z-index:6}
@keyframes fe{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.redcircle{position:absolute;border:2px dashed rgba(248,113,113,.85);border-radius:50%;background:rgba(248,113,113,.12);pointer-events:none;animation:rc .8s ease-in-out infinite}
@keyframes rc{0%,100%{opacity:.45}50%{opacity:1}}
.slam-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.7);pointer-events:none;animation:sr .4s ease-out forwards}
@keyframes sr{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.1);opacity:0}}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.7),rgba(0,0,0,.15));pointer-events:none}
.mine{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd86a,#7b4b12 45%,#211708 72%);border:1px solid #d59b35;box-shadow:0 0 6px rgba(255,190,70,.55);pointer-events:none;z-index:2}
.mine.arming{opacity:.4;filter:grayscale(.6)}
.meteor{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1a0,#ff5a1f 35%,#721515 68%);box-shadow:0 0 22px #ff3b1f;pointer-events:none;z-index:7;animation:meteorDrop .35s ease-in forwards}
@keyframes meteorDrop{from{transform:translate(-80px,-120px) scale(1.5);opacity:.2}to{transform:translate(0,0) scale(1);opacity:1}}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;margin:2px 4px 2px 0;font-size:12px}
.chip .e{font-size:14px}.small{font-size:12px}.dim{color:var(--dim)}
.log{font-size:13px;line-height:1.6;max-height:150px;overflow:auto}
.logrow{padding:2px 0;border-bottom:1px solid var(--line)}.logrow:first-child{color:var(--good)}
.endscreen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,9,18,.85);z-index:60}
.endscreen.show{display:flex}.end-modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:34px 46px;text-align:center}

function tone(freq,dur,type,vol,delay){const ac=audioReady();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(delay||0);o.type=type||'sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.025,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);}

function spell(att,tgt,type){const cls=SPELL[type]||'slash';const ax=fX(att.x),ay=fY(att.y),tx=fX(tgt.x),ty=fY(tgt.y),fx=document.getElementById('fx');if(cls==='laser'){laserBeam(att,tgt);return;}if(cls==='slash'){const dx=tgt.x-att.x,dy=tgt.y-att.y,d=Math.hypot(dx,dy)||1;const px=fX(att.x+dx/d*(att.r+0.25)),py=fY(att.y+dy/d*(att.r+0.25));const s=document.createElement('div');s.className='slashmark';const tilt=(rnd(5)-2)*5;s.style.left=(px-19)+'px';s.style.top=(py-2)+'px';s.style.transform='rotate('+tilt+'deg) scaleX(0)';fx.appendChild(s);requestAnimationFrame(()=>{s.style.transform='rotate('+tilt+'deg) scaleX(1)';s.style.opacity='0';});setTimeout(()=>s.remove(),260);return;}if(cls==='spear'){const p=document.createElement('div');p.className='px spear';const ang=Math.atan2(ty-ay,tx-ax)*180/Math.PI;p.style.left=ax+'px';p.style.top=(ay-1.5)+'px';p.style.transform='rotate('+ang+'deg)';fx.appendChild(p);const dd=Math.hypot(tx-ax,ty-ay);requestAnimationFrame(()=>{p.style.transform='rotate('+ang+'deg) translateX('+dd+'px)';p.style.opacity='0';});setTimeout(()=>p.remove(),250);return;}const n={arrow:2,fire:1,holy:1,bullet:1}[cls]||1;for(let i=0;i<n;i++){const p=document.createElement('div');p.className='px '+cls;const ox=(n>1)?(i-(n-1)/2)*4:0;p.style.left=(ax+ox-3)+'px';p.style.top=(ay-3)+'px';fx.appendChild(p);requestAnimationFrame(()=>{p.style.transform='translate('+(tx-ax-ox)+'px,'+(ty-ay)+'px)';p.style.opacity='0';});setTimeout(()=>p.remove(),240);}}

function renderSlot(){const el=document.getElementById('slotgrid'),g=grid||[],bondCells=new Set(),affected=new Set();if(g.length===15){for(const [dr,dc] of DIRS)for(let r=0;r<GRID_R;r++)for(let c=0;c<GRID_C;c++){const idx=r*GRID_C+c,t=g[idx]?.sym;if(!t||SYM[t].k!=='unit')continue;const pr=r-dr,pc=c-dc;if(pr>=0&&pr<GRID_R&&pc>=0&&pc<GRID_C&&g[pr*GRID_C+pc]?.sym===t)continue;const cells=[idx];let nr=r+dr,nc=c+dc;while(nr>=0&&nr<GRID_R&&nc>=0&&nc<GRID_C&&g[nr*GRID_C+nc]?.sym===t){cells.push(nr*GRID_C+nc);nr+=dr;nc+=dc;}if(cells.length>=3)cells.forEach(i=>bondCells.add(i));}for(let r=0;r<GRID_R;r++)for(let c=0;c<GRID_C;c++){const idx=r*GRID_C+c,t=g[idx]?.sym;if(!t||SYM[t].k!=='eq')continue;let active=false;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr<0||nr>=GRID_R||nc<0||nc>=GRID_C)continue;const ni=nr*GRID_C+nc,ut=g[ni]?.sym,eq=EQMAP[t];if(ut&&SYM[ut].k==='unit'&&(!eq.types||eq.types.includes(ut))){active=true;affected.add(ni);}}if(active)affected.add(idx);}}
 let html='';for(let i=0;i<15;i++){const en=g[i],t=en?en.sym:'empty',s=SYM[t]||SYM.empty,runes=[];runeBuffCells.forEach(info=>{if(info.cells.includes(i))runes.push(SYM[info.type].e);});let cls='scell';if(s.k==='eq')cls+=' eq';if(s.k==='empty')cls+=' empty';if(bondCells.has(i))cls+=' bond';if(affected.has(i))cls+=s.k==='eq'?' active':' affected';if(runes.length)cls+=' rune-target';html+='<div class="'+cls+'" style="--i:'+i+'"><div class="e">'+s.e+'</div><div class="l">'+s.n+'</div>'+(runes.length?'<span class="rune-badge">'+runes.join('')+'</span>':'')+'</div>';}el.innerHTML=html;}

function updateDeathAuras(){const board=document.getElementById('board'),old=new Map([...board.querySelectorAll('.death-aura')].map(x=>[x.dataset.id,x]));if(!inBattle){old.forEach(x=>x.remove());return;}const alive=new Set();entities.filter(e=>e.deathKnight&&e.hp>0&&!e.reviving).forEach(e=>{const id=String(e.id);alive.add(id);let d=old.get(id);if(!d){d=document.createElement('div');d.className='death-aura';d.dataset.id=id;board.appendChild(d);}const w=8*PP();d.style.left=(fX(e.x)-w/2)+'px';d.style.top=(fY(e.y)-w/2)+'px';d.style.width=w+'px';d.style.height=w+'px';});old.forEach((x,id)=>{if(!alive.has(id))x.remove();});}
function updateAimLines(){const fx=document.getElementById('fx');if(!fx)return;fx.querySelectorAll('.aim-line').forEach(x=>x.remove());if(!inBattle||entities.length>65)return;entities.filter(e=>e.side==='player'&&e.type==='musketeer'&&e.hp>0&&!e.stun&&!e.thrown&&!e.casting).forEach(e=>{const t=getTarget(e);if(!t||t.hp<=0||edgeDist(e,t)>e.range)return;const ready=actionReady(e);if(ready)return;const ax=fX(e.x),ay=fY(e.y),tx=fX(t.x),ty=fY(t.y),dx=tx-ax,dy=ty-ay,d=document.createElement('div');d.className='aim-line';d.style.left=ax+'px';d.style.top=ay+'px';d.style.width=Math.hypot(dx,dy)+'px';d.style.transform='rotate('+(Math.atan2(dy,dx)*180/Math.PI)+'deg)';d.style.opacity=String(.3+.55*Math.min(1,e.action/(e.nextCd||e.cdMax)));fx.appendChild(d);});}
function renderField(){const board=document.getElementById('board');board.classList.toggle('battle',inBattle);renderTerrain();renderRunes();updateDeathAuras();renderPlagueClouds();board.querySelectorAll('.mine').forEach(el=>el.remove());if(inBattle)mines.forEach(m=>{const d=document.createElement('div'),sz=0.4*PP();d.className='mine'+(m.arm>0?' arming':'');d.style.left=(fX(m.x)-sz/2)+'px';d.style.top=(fY(m.y)-sz/2)+'px';d.style.width=sz+'px';d.style.height=sz+'px';board.appendChild(d);});const list=inBattle?entities:roster.concat(temps).filter(u=>u.placed).concat(watchtower&&watchtower.hp>0?[watchtower]:[]);const seen=new Set();list.forEach(u=>{if(u.hp<=0||u.jumping)return;seen.add(u.id);let el=unitEls[u.id];const px=fX(u.x),py=fY(u.y),diam=u.r*2*PP(),fs=Math.max(11,Math.round(diam*0.42));if(!el){el=document.createElement('div');el.innerHTML='<span class="u-emoji"></span><span class="u-hp"></span><div class="u-bar"><i></i></div>';board.appendChild(el);unitEls[u.id]=el;el._init=false;} el.style.transition=(!el._init)?'none':(u.thrown?'left .08s linear,top .08s linear':u.charging?'none':'');let cls='unit '+(u.side==='player'?'pl':'en');if(u.temp)cls+=' temp';if(u.atkFlash>0){cls+=' atk';el.style.setProperty('--lx',((u.lungeDc||0)*5)+'px');el.style.setProperty('--ly',((u.lungeDr||0)*5)+'px');}if(u.hitFlash>0)cls+=' hit';if(u.reviving)cls+=' reviving';if(u.amphibious&&u.submerged)cls+=' submerged';if(u.phaseTicks>0)cls+=' phasing';if(u.backdoor)cls+=' backdoor';if(u.boundSpirit)cls+=' bound-spirit';if(u.stealth)cls+=' stealth';if(u.bloodTime>0)cls+=' blood';if(u.blessTime>0)cls+=' blessed';if(u.chargeGuard>0)cls+=' charge-guard';if(u.charging){cls+=' charging';el.style.setProperty('--charge-angle',(u.chargeAngle||0)+'deg');}if(!inBattle&&u.side==='player'&&!u.temp&&!u.structure){cls+=' drag';el.draggable=true;el.ondragstart=(ev)=>{setDrag(u.id,'board');try{ev.dataTransfer.setData('text','1');}catch(_){}};}else el.draggable=false;el.className=cls;if(u.hitFlash||u.stealth||u.bloodTime>0||u.blessTime>0)el.style.boxShadow='';else if(u.buffs&&u.buffs.length&&!u.temp)el.style.boxShadow='0 0 10px '+BUFFCOL[u.buffs[0]];else if(onHigh(u))el.style.boxShadow='0 0 10px #9fe8ff';else el.style.boxShadow='';el.style.left=(px-diam/2)+'px';el.style.top=(py-diam/2)+'px';el.style.width=diam+'px';el.style.height=diam+'px';const emo=el.querySelector('.u-emoji');emo.textContent=u.e;emo.style.fontSize=fs+'px';el.querySelector('.u-hp').textContent=u.reviving?'重组 '+Math.max(0,(u.reviveTicks*.36).toFixed(1))+'s':Math.ceil(u.hp)+(u.shield>0?'+'+Math.ceil(u.shield):'')+(u.fireShield>0?'🔥'+Math.ceil(u.fireShield):'');const pct=Math.max(0,u.hp/u.maxhp*100),col=u.side==='player'?'var(--accent)':'var(--bad)',bar=el.querySelector('.u-bar i');bar.style.width=pct+'%';bar.style.background=col;if(!el._init){void el.offsetWidth;el._init=true;}});Object.keys(unitEls).forEach(id=>{if(!seen.has(parseInt(id))){if(unitEls[id])unitEls[id].remove();delete unitEls[id];}});updateAimLines();document.getElementById('enemiesleft').textContent=inBattle?entities.filter(e=>e.side==='enemy'&&e.hp>0&&(!e.boundSpirit||entities.some(o=>o.id===e.spiritOwner&&o.hp>0))).length+delayedSpawns.reduce((n,g)=>n+g.items.length,0):0;}
function renderBench(){const list=roster.concat(temps).filter(u=>!u.placed);document.getElementById('bench').innerHTML=list.map(u=>'<div class="btile'+(u.temp?' temp':'')+'" draggable="true" ondragstart="setDrag('+u.id+',\'bench\')"><div class="e-emoji">'+u.e+'</div></div>').join('')||'<span class="dim small">空</span>';}
function renderNext(){const c=WAVES[waveNum];document.getElementById('nextnum').textContent=c?('第 '+waveNum+' 波 · '+(WAVE_NAMES[waveNum]||'')):'已通关';document.getElementById('nextwave').innerHTML=c?Object.entries(c).map(([k,n])=>chip(ENEMIES[k].e,ENEMIES[k].n,n)).join(''):'<span class="dim small">—</span>';}
function renderGold(){document.getElementById('gold').textContent=gold;}
function renderArmy(){document.getElementById('benchcount').textContent=roster.length+temps.length;document.getElementById('placedcount').textContent=placedCount();document.getElementById('wavenum').textContent=waveNum;}
function combatLog(msg){if(inBattle)log('⚔ '+msg);}
function log(msg){const el=document.getElementById('log');const d=document.createElement('div');d.className='logrow';d.textContent=msg;el.prepend(d);while(el.children.length>16)el.removeChild(el.lastChild);}
function setControls(){document.getElementById('startwave').disabled=inBattle||awaiting||!drawnThisWave||placedCount()===0||!WAVES[waveNum];document.getElementById('spin').disabled=inBattle||awaiting||drawnThisWave;document.getElementById('slotpanel').classList.toggle('ready',!inBattle&&!awaiting&&!drawnThisWave);}
function phase(){const p=document.getElementById('phase');p.textContent=inBattle?'战斗中':'间歇期';p.className='phase '+(inBattle?'fight':'rest');document.getElementById('slotpanel').classList.toggle('hide',inBattle);setControls();}
function renderAll(){renderGold();renderPool();renderArmy();renderBench();renderNext();renderSlot();renderBonds();renderTerrain();renderField();updatePop();setControls();}

function almCard(e,n,side,hp,atk,cd,range,diam,desc){return '<div class="alm-card"><div class="alm-port '+side+'">'+e+'</div><div class="alm-info"><div class="alm-name">'+n+' <span class="dim small">('+(side==='pl'?'我方':'敌方')+')</span></div><div class="alm-stats">HP '+hp+' · 攻击 '+atk+' · cd '+cd+' · 射程 '+range+' · 直径 '+diam+'</div><div class="alm-desc">'+(desc||'')+'</div></div></div>';}
function renderAlmanac(){let html='<div class="alm-modal"><div class="alm-title"><span>图鉴 · 敌我单位一览</span><button class="alm-close" onclick="closeAlmanac()">关闭</button></div><div class="alm-grid">';ALLY.forEach(k=>{const s=STATS[k],atk=s.amin===s.amax?s.amin:s.amin+'~'+s.amax;html+=almCard(s.e,s.n,'pl',s.hp,atk,s.cd,s.range,s.r*2,'');});Object.keys(ENEMIES).forEach(k=>{const s=ENEMIES[k],atk=s.amin===s.amax?s.amin:s.amin+'~'+s.amax;html+=almCard(s.e,s.n,'en',s.hp,atk,s.cd,s.range,s.r*2,s.desc||'');});html+='</div></div>';document.getElementById('almanac').innerHTML=html;}
function openAlmanac(){renderAlmanac();document.getElementById('almanac').classList.add('show');}
function closeAlmanac(){document.getElementById('almanac').classList.remove('show');}
function addTestLeader(){if(inBattle||awaiting){log('请在间歇期添加测试领袖');return;}if(roster.concat(temps).some(u=>u.type==='leader')){log('场上已经存在步兵领袖');return;}const u=mkEntity('player','leader');u.temp=true;u.placed=true;const p=freePos();u.x=p.x;u.y=p.y;temps.push(u);log('（测试）添加步兵领袖；降至100 HP时召集援军');renderAll();}
function init(){
 stopAllChargeAnimations();eid=0;pidc=0;gold=START_GOLD;waveNum=1;popLevel=0;inBattle=false;awaiting=false;choiceQueue=0;shopPending=false;shopStock=[];shopPurchases=0;watchtower=null;towerUp={archer:0,guard:0,fort:0};runeBuffCells=new Map();pendingAddedSymbols=[];delayedSpawns=[];roster=[];temps=[];entities=[];dangers=[];mines=[];mineId=0;plagueClouds=[];plagueCloudId=0;combatCloseNow=false;grid=null;instanceBuffs=new Map();bondSum=[];
 if(timer){clearInterval(timer);timer=null;}
 pool=[];['infantry','infantry','shield','archer','priest'].forEach(s=>pool.push(mkEntry(s)));for(let i=0;i<10;i++)pool.push(mkEntry('empty'));
 document.getElementById('log').innerHTML='';document.getElementById('choices').classList.remove('show');document.getElementById('endscreen').classList.remove('show');document.getElementById('board').innerHTML='<div id="terrain"></div><div class="fx" id="fx"></div>';unitEls={};warnCircles=[];lastForm=[];alertTime=0;meleeAlertTime=0;supportAlertTime=0;
 setupWatchtower();layout(false);phase();
}
document.addEventListener('DOMContentLoaded',()=>{
 init();
 document.getElementById('spin').onclick=()=>{if(!inBattle&&!awaiting&&!drawnThisWave)spinSlot();};
 document.getElementById('reset').onclick=init;
 document.getElementById('almanacBtn').onclick=openAlmanac;
 document.getElementById('startwave').onclick=startWave;
 document.getElementById('uppop').onclick=()=>{if(inBattle||popLevel>=POP_INC.length)return;const c=POP_COST[popLevel];if(gold<c){log('金币不足');return;}gold-=c;const inc=POP_INC[popLevel];popLevel++;log('人口上限 +'+inc+' → '+popCap()+'（'+c+'金）');renderAll();};
 document.getElementById('testgold').onclick=()=>{gold+=30;log('（测试）+30 金币');renderAll();};
 document.getElementById('testleader').onclick=addTestLeader;
});
</script>
</body>
