  progress=(c.started?'运输 '+c.index+'/'+(c.path.length-1):'动力车待启动')+(s.local.part?' · 静音齿轮已安装':'');

 }else if(c.kind==='sequence'){
  progress='机关 '+c.progress+'/3';target=c.read?'rune-'+c.order[c.progress]:'city-inscription';title=c.read?'前往'+({hammer:'锤殿',lamp:'灯殿',wave:'水殿'})[c.order[c.progress]]+'唤醒'+runeName(c.order[c.progress]):'阅读中央广场的启门碑';
  if(c.read)progress+=' · '+c.order.map((id,i)=>(i<c.progress?'✓':'')+runeName(id)).join(' → ');
 }else{
  const high=s.turn%16>=8,left=(high?16:8)-s.turn%16;
  progress='水闸 '+(Number(c.high)+Number(c.low))+'/2 · '+(high?'涨水':'退水')+'还剩 '+left+' 回合';
  const options=s.sites.filter(a=>a.id==='sluice-high'&&!c.high||a.id==='sluice-low'&&!c.low).sort((a,b)=>distance(a)-distance(b));
  const a=options[0];target=a?.id;if(a){const ready=(target==='sluice-high')===high&&left>=2;title=distance(a)<=1&&!ready?'等待'+(target==='sluice-high'?'涨水，释放浮闸':'退水，锁住导流槽'):'前往'+(target==='sluice-high'?'浮闸释放轮':'导流锁定轮');}
 }
 const exits=s.sites.filter(a=>['mechanical','water','random-exit'].includes(a.id)&&a.discovered&&(a.id!=='mechanical'||c.complete)).sort((a,b)=>distance(a)-distance(b));if(c.complete||exits.length){target=exits[0]?.id||'mechanical';point=null;title='寻找出口，前往第'+((s.depth||1)+1)+'层';if(target==='mechanical'&&c.kind==='tide'&&s.turn%16>=7)title='近出口等待退水，或寻找免任务出口';if(s.companion&&distance(s.companion)>3){title='接应同伴，再前往第'+((s.depth||1)+1)+'层';point=s.companion;target=null;}if(s.bombs.length)title='远离炸药，等爆炸后下层';}else title+='，或寻找免任务出口';progress='第'+(s.depth||1)+'层 · 近出口任务：'+progress;

function liveDangers(){
 const s=game.state,p=s.player,d=game.danger(),list=[],t=game.tile(p.x,p.y);if(!['home','playing'].includes(s.mode))return list;
 const add=(priority,title,detail)=>list.push({priority,title,detail});
 if(s.mode==='playing'){
  const bombs=s.bombs.filter(b=>Math.max(Math.abs(b.x-p.x),Math.abs(b.y-p.y))<=1);
  if(bombs.length)add(100,'炸药将爆炸 · 立刻离开橙色范围','范围内有'+bombs.length+'枚炸药。移动、攻击和使用道具都会推进引信；优先撤开。');
  for(const m of s.monsters)if(game.monsterPlanVisible(m)&&m.plan.cells.some(cell=>cell.damage!==false&&cell.x===p.x&&cell.y===p.y))add(game.isPriorityMelee(m)?98:90,game.isPriorityMelee(m)?'迅捷先手 · 抢先击倒或持盾抵挡':'攻击将至 · 移出危险标记',game.isPriorityMelee(m)?MONSTERS[m.type].name+'已锁定近战，移动或用物品前会先受击。抢先攻击后若敌人存活，仍会受击。':MONSTERS[m.type].name+'正瞄准你所在的位置。留意地图上的攻击范围，走到标记外。');
  for(const m of s.monsters)if(game.monsterPlanVisible(m)){const k=m.plan.kind,left=Math.max(0,m.plan.due-s.turn),hit=m.plan.cells.some(c=>c.x===p.x&&c.y===p.y);
   if(k==='alarm')add(86,'鸣囊兽即将叫响 · '+left+' 回合','攻击或冻结可打断；叫声最多引来3只会调查鸣叫的怪物，追查的是声源。');
   if(k==='steal'&&Math.abs(m.x-p.x)+Math.abs(m.y-p.y)<=1)add(89,'矿鼠盯上行囊 · 拉开或攻击','下回合仍贴身会被偷最多2块银矿；追击可夺回，逃回窝也会留下藏矿位置。');
   if(k==='current'&&hit)add(91,'涌流将至 · 沿箭头推1格','移出蓝绿标记、走上永久绳桥，或攻击/冻结水母打断。深水和障碍会挡住推移。');
   if(k==='gate')add(74,'铜偶正在转门 · '+left+' 回合','即将开启'+(m.plan.next+1)+'号近路，其余近路关闭。地图有开/关标记；攻击或冻结可打断。');
   if(k==='burrow')add(65,'薄岩正在开裂 · '+left+' 回合','掘岩虫即将打开标记的薄岩；出洞后会伏地休整2回合。');
  }
  if(d.warning)add(95,'脚下即将塌落 · 移出裂缝','脚下还有'+d.safeTurns+'回合塌落。不要在这里挖掘、休息或连续等待。');
  if(t?.kind==='ice'&&t.iceUntil-s.turn<=2)add(93,'脚下冰桥将融化 · 尽快上岸','冰桥剩余'+Math.max(0,t.iceUntil-s.turn)+'回合，绳索可将其固定为永久通路。');
  if(t?.tidal&&!['bridge','ice'].includes(t.kind)&&s.turn%16>=6&&s.turn%16<8)add(85,'即将涨水 · 离开低滩','再过'+(8-s.turn%16)+'回合涨水。沿高地或永久桥梁撤开。');
 }
 const risk=s.adventure.risk;
 if(s.mode==='playing'&&risk?.due!==null&&risk?.due>s.turn&&!risk.secured&&!risk.collapsed&&risk.due-s.turn<=5&&Math.abs(p.x-risk.entry.x)+Math.abs(p.y-risk.entry.y)<=7)add(70,'支洞物资将被埋 · 剩 '+(risk.due-s.turn)+' 回合','取走装备可稳住物资龛；来不及时先撤离，不必为了支路耽误本章目标。');
 if(d.worldLeft!==null&&d.worldLeft<=60)add(80,'全区塌陷倒计时 · 剩 '+d.worldLeft+' 回合','完成眼下的撤离条件，前往出口；时间推进才会减少倒计时。');
 if(d.campLeft!==null&&d.campLeft<=12&&s.mode==='home')add(88,'营地将塌 · 剩 '+d.campLeft+' 回合','从矿道出口离开，避免修理或休息耽搁撤离。');

let discoveryState={game:null,level:-1,known:new Map(),unread:new Set()};
const noteSignature=n=>n.title+'\n'+n.text+'\n'+n.target;
function syncDiscoveries(){const s=game.state;if(discoveryState.game!==game||discoveryState.level!==s.level){discoveryState={game,level:s.level,known:new Map(s.notes.map(n=>[n.id,noteSignature(n)])),unread:new Set()};}else{for(const n of s.notes){const signature=noteSignature(n);if(discoveryState.known.get(n.id)!==signature){discoveryState.known.set(n.id,signature);discoveryState.unread.add(n.id);}}}renderDiscoveryNotice();}
function renderDiscoveryNotice(){const b=$('#discovery-button'),n=discoveryState.unread.size;b.hidden=!n;b.textContent='新线索 '+n+' · 查看';b.setAttribute('aria-label',n+'条未读线索，点击查看');}

function captureInvestigation(action){if(action.type!=='interact'&&!(action.type==='choose'&&action.kind==='chapter:read'))return null;const s=game.state;return {level:s.level,mode:s.mode,turn:s.total,hp:s.player.hp,armor:s.player.armor,site:action.type==='interact'?game.nearby():null,notes:new Map(s.notes.map(n=>[n.id,noteSignature(n)]))};}

 const s=game.state;if(!before||before.mode!=='playing'||s.mode!=='playing'||s.level!==before.level||s.panel)return;
