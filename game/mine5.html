function interactHere(){if(aim){commitAim();return;}const s=game.state;
 if(s.mode==='playing'&&game.nearby()&&(Object.values(game.groundItems()).some(n=>n>0)||game.groundEquipment().length||game.groundCards().length)){act({type:'pickup'});return;}
 if(s.mode==='playing'&&!game.nearby()&&!(Object.values(game.groundItems()).some(n=>n>0)||(game.groundEquipment().length>0||game.groundCards?.().length>0))&&game.assistCheck().ok){act({type:'choose',kind:'companion-assist'});return;}
 if(!game.nearby()&&s.mode==='playing'){const ground=Object.entries(game.groundItems()).filter(([,n])=>n>0);if(ground.length||game.groundEquipment().length||game.groundCards().length){act({type:'pickup-all'});return}}

function inspectNearest(){const s=game.state,p=s.player,v=game.visible();
 const target=s.monsters.filter(m=>game.monsterVisible(m,v))
  .sort((a,b)=>game.bodyGap(a,p,true)-game.bodyGap(b,p,true))[0];
 if(!target){game.log('视野里没有能看清楚的生物。','warn');sync();return}

function restartPrompt(){open('restart',`<div class="dialog-kicker">重新开始 · 本局 ${game.state.code}</div><h2 class="dialog-title">重新开始一局？</h2><p class="dialog-copy">当前进度不会保存。重新开始会改变矿洞地形、遇到的怪物和地下环境。</p><div class="dialog-actions">${button('继续当前旅途','close')}${button('重新开始','retry',true)}</div>`)}
function move(dx,dy){stopPointerTravel();if(aim){stepAim(dx,dy);return;}holdBlocked=false;act({type:'move',dx,dy})}
function pointerCell(e){const b=canvas.getBoundingClientRect(),px=(e.clientX-b.left)*CW/b.width,py=(e.clientY-b.top)*CH/b.height;
 if(game.state.mode==='home'){const h=homeView();return{x:h.minX+Math.floor(((px-h.x)/h.scale-h.gridX)/160),y:Math.floor(((py-h.y)/h.scale-h.gridY)/160)};}
 const pv=pose('player',game.state.player,performance.now());return{x:Math.floor(px/(S*zoom)+pv.x-(CW/(2*zoom)-40)/S),y:Math.floor(py/(S*zoom)+pv.y-(CH/(2*zoom)-40)/S)};

function stopPointerTravel(){pointerTravel=null;pointerIntent=null;$('#pointer-stop').hidden=true;}
function pointerNotice(message){game.log(message,'warn');sync();}
function pointerRisk(x,y){const s=game.state,t=game.tile(x,y);return !!t?.collapseAt||(s.bombs||[]).some(b=>Math.max(Math.abs(b.x-x),Math.abs(b.y-y))<=1)||(s.eliteHeat||[]).some(h=>h.until>=s.turn&&h.x===x&&h.y===y)||(s.reactions?.pending||[]).some(h=>h.due>s.turn&&h.cells.some(c=>c[0]===x&&c[1]===y))||game.threatsAt(x,y).length>0;}
function pointerWalkable(x,y){const t=game.tile(x,y),m=game.at(x,y);return !!t?.seen&&game.passable(x,y)&&!(m&&game.monsterVisible(m))&&!pointerRisk(x,y);}
function pointerPath(target,adjacent=false){const start=game.state.player,key=p=>p.x+','+p.y,points=[{x:start.x,y:start.y}],prev=new Map([[key(start),null]]);let end=null;
 for(let i=0;i<points.length;i++){const p=points[i],gap=Math.abs(p.x-target.x)+Math.abs(p.y-target.y);if(gap===(adjacent?1:0)){end=p;break;}for(const [dx,dy]of [[0,-1],[1,0],[0,1],[-1,0]]){const n={x:p.x+dx,y:p.y+dy};if(!prev.has(key(n))&&pointerWalkable(n.x,n.y)){prev.set(key(n),p);points.push(n);}}}
 if(!end)return null;const path=[];for(let p=end;prev.get(key(p));p=prev.get(key(p)))path.push(p);return path.reverse();
}
function finishPointerTravel(travel){const s=game.state,p=s.player;stopPointerTravel();if(travel.siteId){const a=s.sites.find(a=>a.id===travel.siteId&&a.discovered&&game.sitePresent(a));if(a&&Math.max(Math.abs(a.x-p.x),Math.abs(a.y-p.y))<=1&&game.ray(p.x,p.y,a.x,a.y)){game.pointedSiteId=a.id;act({type:'interact'});}}
 else if(travel.dig)pointerNotice('已靠近矿壁，点它挖掘；每次点按只敲一次。');
 else if(travel.pickup&&p.x===travel.target.x&&p.y===travel.target.y&&(game.groundCards().length||game.groundEquipment().length||Object.values(game.groundItems()).some(n=>n>0)))act({type:'pickup'});
}
function advancePointerTravel(time){if(animBusy())return;if(pointerIntent){const cell=pointerIntent;pointerIntent=null;handlePointerCell(cell);return;}const travel=pointerTravel;if(!travel||time<travel.nextAt)return;
 const s=game.state,p=s.player;if(dialog.open||aim||s.mode!=='playing'||s.floorSeed!==travel.floorSeed||holdBlocked||document.hidden){stopPointerTravel();return;}
 if(!travel.path.length){finishPointerTravel(travel);return;}
 const next=travel.path[0];if(Math.abs(next.x-p.x)+Math.abs(next.y-p.y)!==1||!pointerWalkable(next.x,next.y)||game.at(next.x,next.y)){stopPointerTravel();pointerNotice('路线出现阻碍，已停步。');return;}
 travel.path.shift();travel.nextAt=time+180;const x=p.x,y=p.y,result=act({type:'move',dx:next.x-x,dy:next.y-y},true);
 if(!result||p.x!==next.x||p.y!==next.y){stopPointerTravel();return;}
 if(travel.singleStep){stopPointerTravel();return;}
 if(pointerTravel&&(s.monsters.some(m=>game.monsterVisible(m))||s.bombs.length||pointerRisk(p.x,p.y))){stopPointerTravel();pointerNotice('附近有威胁，已停步；点按逐格行动。');}
}
function handlePointerCell(cell){if(dialog.open)return;stopPointerTravel();if(animBusy()){pointerIntent=cell;return;}const s=game.state,p=s.player,{x,y}=cell;
 if(s.mode==='home'){if(!game.homeCell(x,y))return;act({type:'home-select',x,y});if(game.homeFacilities().some(a=>a.x===x&&a.y===y))act({type:'interact'});return;}
 if(s.mode!=='playing'||aimAt(x,y))return;delete game.pointedSiteId;const t=game.tile(x,y),gap=Math.abs(x-p.x)+Math.abs(y-p.y),visible=game.visible();
 if(!t?.seen){pointerNotice('先点已探索的格子，逐步靠近未知区域。');return;}
 const m=game.at(x,y);if(m&&game.monsterVisible(m,visible)){if(game.weaponReach(m,{x,y})){act({type:'weapon-attack',monsterId:m.id,x,y});}else inspectCreature(m);return;}
 const site=s.sites.find(a=>a.x===x&&a.y===y&&a.discovered&&game.sitePresent(a)&&t.kind!=='rubble');
 const pickup=visible.has(x+','+y)&&!!(t.ventureFinds||t.cards?.length||t.equipment?.length||Object.values(t.items||{}).some(n=>n>0));
 if(!gap&&pickup){act({type:'pickup'});return;}
 if(site&&Math.max(Math.abs(x-p.x),Math.abs(y-p.y))<=1&&game.ray(p.x,p.y,x,y)){game.pointedSiteId=site.id;act({type:'interact'});return;}
 if(!gap){if(game.nearby())interactHere();return;}
 if(t.kind==='wall'||t.gate&&t.kind==='hard'){pointerNotice(game.terrainInfo(x,y).text);return;}
 if(gap===1){move(x-p.x,y-p.y);return;}
 const dig=['rock','ore','hard','rubble'].includes(t.kind);if(!dig&&!game.passable(x,y)){pointerNotice('这里不能直接通行，可先靠近再搭桥或处理地形。');return;}
 const path=pointerPath(cell,dig||!!site);if(!path){pointerNotice('没有已探索的安全路线，请逐格靠近。');return;}
 const singleStep=s.monsters.some(m=>game.monsterVisible(m,visible))||s.bombs.length>0||pointerRisk(p.x,p.y);holdBlocked=false;pointerTravel={target:cell,path:singleStep?path.slice(0,1):path,siteId:site?.id,dig,pickup,singleStep,floorSeed:s.floorSeed,nextAt:performance.now()};$('#pointer-stop').hidden=singleStep||path.length<2;advancePointerTravel(performance.now());
}

function clearPointerGesture(){clearTimeout(pointerLongTimer);pointerLongTimer=null;pointerGesture=null;}
canvas.addEventListener('pointerdown',e=>{if(!e.isPrimary||e.button!==0)return;stopPointerTravel();queuedMove=null;queuedAction=null;clearPointerGesture();pointerSuppressClick=false;pointerGesture={id:e.pointerId,x:e.clientX,y:e.clientY,cell:pointerCell(e)};

});

const creatureDescriptions={
 burrower:'矿区的掘岩虫只追查挖掘、爆炸和矿车震动，普通投矿声骗不了它。指定薄岩出现裂纹后，2回合钻开近路，出洞伏地休整2回合。它不能破坏边界、石门或任务装置。靠近后蓄力撕咬，锁定后迅捷先手，移动或用物品前会受1点伤害；抢先击倒可阻止。',

// 键盘总表：移动 WASD/方向键；空格互动；. 等待；1/2 换手；I 背包；G 地面；M 地图；
// J 线索；V 局势；H 指南；C 观察；Z 广域；物品键同样必须先手持。
const DIRKEYS={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
const PANELKEYS={i:bag,e:equipment,q:offhandMenu,m:showMap,j:journal,h:help,'?':help,v:runInfo};

// 弹窗打开时也能纯键盘操作：方向键移动焦点、Enter/空格确认、Esc 返回、数字键直选。
function dialogKeys(e,k){if(e.target.closest?.('input,select,textarea,[contenteditable]'))return;const btns=[...content.querySelectorAll('button:not([disabled])')].filter(b=>b.getClientRects().length);
 if(k==='arrowdown'||k==='arrowright'||k==='arrowup'||k==='arrowleft'){
  if(!btns.length)return;e.preventDefault();
  const cur=btns.indexOf(document.activeElement),back=(k==='arrowup'||k==='arrowleft')?-1:1;
  btns[cur<0?(back>0?0:btns.length-1):(cur+back+btns.length)%btns.length].focus({preventScroll:true});return}
 if(k==='enter'||k===' '){const focused=document.activeElement;
  if(focused&&['BUTTON','SUMMARY'].includes(focused.tagName)&&content.contains(focused))return;
  e.preventDefault();const b=content.querySelector('button.primary:not([disabled])')||btns[0];if(b)b.click();return}
 if(/^[1-9]$/.test(k)){const b=btns[Number(k)-1];if(b){e.preventDefault();b.click()}return}
 if(k==='z'){e.preventDefault();zoom=zoom<1?1:.5;return}
 if(PANELKEYS[k]){e.preventDefault();showPanel(PANELKEYS[k])}
}
window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;stopPointerTravel();const k=e.key.toLowerCase();
 if(dialog.open){if(e.repeat&&[' ','enter','1','2','3','4','5','6','7','8','9'].includes(k)){e.preventDefault();return}dialogKeys(e,k);return}
 // Native controls own Space/Enter; game shortcuts apply when focus is on the map.
 if((k===' '||k==='enter')&&e.target.closest?.('button,a[href],input,select,textarea,summary,[contenteditable]')){if(e.repeat)e.preventDefault();return}
 if(e.target.closest?.('#card-dock,#card-popover')&&['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k))return;
 if(k==='escape'){cardSelection=null;cardHover=null;if(!cardDockPinned)cardDockOpen=false;renderCardDock();cancelAim();if(game.state.panel)closeContext();$('#more-tools').hidden=true;canvas.focus({preventScroll:true});return}
 if(aim&&(k==='enter'||k===' ')){e.preventDefault();if(!e.repeat)commitAim();return;}
 if(DIRKEYS[k]){e.preventDefault();if(e.repeat&&holdBlocked)return;if(!e.repeat)holdBlocked=false;const now=performance.now();if(e.repeat&&now-lastMove<150)return;lastMove=now;move(...DIRKEYS[k]);return}
 if(e.repeat){if(k===' '||k==='enter')e.preventDefault();return}
 if(k===' ')interactHere();
 else if(k==='.'||k==='5'){e.preventDefault();if(!aim)act({type:'wait'});}

 else if(k==='f'){e.preventDefault();beginWeaponUse();}
 else if(k==='g')act({type:'pickup'});
 else if(k==='c')inspectNearest();

 else if(k==='z'){zoom=zoom<1?1:.5;sync()}

 else return;
 e.preventDefault();

function stepAim(dx,dy){if(!aim)return;const p=game.state.player,list=aim.targets.filter(t=>(t.x-p.x)*dx+(t.y-p.y)*dy>0).sort((a,b)=>Math.abs(a.x-p.x)+Math.abs(a.y-p.y)-Math.abs(b.x-p.x)-Math.abs(b.y-p.y));if(list.length){const at=list.indexOf(aim.selected);aim.selected=list[(at+1)%list.length];renderAim();}}

function syncControls(){const s=game.state,p=s.player,d=game.danger();syncRaidStrip();syncQuickbar();const weaponButton=$('#weapon-action'),rest=game.weaponActionLabel(),checkWeapon=game.weaponCheck();weaponButton.hidden=s.mode!=='playing'||!p.equipped.main;weaponButton.disabled=!checkWeapon.ok||!!aim||animBusy();weaponButton.dataset.ready=String(!rest);$('#weapon-label').textContent=rest?rest.split(' · ')[0]:game.weaponRole();$('#weapon-cost').textContent=rest?'1回合 · 不耗耐久':game.weaponCostLabel();weaponButton.title=checkWeapon.ok?(rest||'选择目标，不立即消耗回合')+' · F':checkWeapon.reason;$('#equipment-summary').textContent=(GEAR[p.equipped.main]?.name||'主手空置')+' · '+(GEAR[p.equipped.off]?.name||'副手空置')+' · '+game.lightLabel();$('#mobile-health').textContent='♥ '+p.hp+'/'+p.maxHp;$('#mobile-armor').textContent='甲 '+p.armor;$('#mobile-light').textContent=s.mode==='home'?'营地':game.carriedLights().length?game.lightRadius()+'格光':'无光源';$('#mobile-turn').textContent=s.total+'回合';$('#mobile-objective').textContent=presentedObjective().text;$('#mobile-objective').title=presentedObjective().text;$('#mobile-arrow').textContent=$('#compass').textContent;
 const risk=s.adventure.risk,bomb=s.bombs[0],tide=s.adventure.tide,ice=s.adventure.ice.filter(i=>i.due>s.turn);let warning=bomb?'炸药还有 '+Math.max(0,bomb.due-s.turn)+' 次行动引爆，离开橙色范围！':d.warning?'脚下裂缝：'+d.safeTurns+'回合后塌落':d.worldLeft!==null?'撤离还剩 '+d.worldLeft+' 回合':risk?.due&&!risk.secured&&!risk.collapsed?'支洞奖励还剩 '+Math.max(0,risk.due-s.turn)+' 回合':ice.length?'冰桥还剩 '+Math.min(...ice.map(i=>i.due-s.turn))+' 回合':tide?'水位'+(tide.high?'高':'低')+' · '+((tide.high?16:8)-s.turn%16)+'回合后'+(tide.high?'退水':'涨水'):'';$('#mobile-danger').textContent=warning;
 const feedback=$('#feedback');$('#mobile-feedback').textContent=feedback.textContent;$('#mobile-feedback').className='mobile-feedback '+(feedback.classList.contains('danger')?'danger':feedback.classList.contains('warn')?'warn':'');
 const check=game.assistCheck(),near=game.nearby(),ground=s.mode==='playing'&&(Object.values(game.groundItems()).some(n=>n>0)||(game.groundEquipment().length>0||game.groundCards?.().length>0||game.tile(p.x,p.y).ventureFinds));if(s.mode==='playing'&&!near&&!ground&&check.ok){$('#interact').disabled=animBusy();$('#interact-label').textContent=check.label;}
 if(aim)$('#interact').disabled=true;$('#wait-touch').disabled=s.mode!=='playing'||!!aim||animBusy();$('#wait').disabled=s.mode!=='playing'||!!aim||animBusy();if(aim){const old=aim.selected;aim.targets=aimTargets();aim.selected=aim.targets.find(t=>t.x===old?.x&&t.y===old?.y)||aim.targets[0]||null;renderAim();}
}
function drawPointerPreview(ox,oy,visible){if(dialog.open||aim||animBusy()||game.state.mode!=='playing')return;const target=hoverCell,m=target&&game.at(target.x,target.y);if(m&&game.monsterVisible(m,visible)){const reachable=game.weaponReach(m,target),ready=reachable&&game.playerCanStrike(m);if(reachable)for(const c of game.weaponPattern(target).cells){if(!visible.has(c.x+','+c.y))continue;ctx.strokeStyle=ready?'#e1c790aa':'#a6a79d88';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.strokeRect((c.x-ox)*S+5,(c.y-oy)*S+5,S-10,S-10);ctx.setLineDash([]);}const label=game.weaponActionLabel()||(!reachable?'超出攻击范围':m.type==='mud'&&!EscapeEngine.isPick(game.state.player.equipped.main)?'需要矿镐':ready?game.weaponCostLabel(m):'武器耐久或生命不足');text(MONSTERS[m.type].name+' '+m.hp+'/'+m.maxHp,(target.x-ox)*S+40,(target.y-oy)*S-12,'#e8d7ad',14);text(label,(target.x-ox)*S+40,(target.y-oy)*S+92,'#d4ccb4',12);}
 if(pointerTravel)for(const c of pointerTravel.path.slice(0,6)){if(!visible.has(c.x+','+c.y))continue;ctx.fillStyle='#c7b38466';ctx.beginPath();ctx.arc((c.x-ox)*S+40,(c.y-oy)*S+40,3,0,Math.PI*2);ctx.fill();}}
function drawItemAim(ox,oy){if(!aim||dialog.open)return;const chosen=aim.selected,drawn=new Set();for(const t of aim.targets){const k=t.x+','+t.y;if(drawn.has(k))continue;drawn.add(k);const x=(t.x-ox)*S,y=(t.y-oy)*S;rect(x+4,y+4,72,72,'#99dcb927');ctx.strokeStyle='#b5d9b2';ctx.lineWidth=2;ctx.strokeRect(x+6,y+6,68,68);}
 if(!chosen)return;if(aim.item==='bomb'||aim.weapon&&['spear','crossbow'].includes(aim.item)){const p=game.state.player;ctx.save();ctx.setLineDash([7,5]);line([[(p.x-ox)*S+40,(p.y-oy)*S+40],[(chosen.x-ox)*S+40,(chosen.y-oy)*S+40]],'#e9ca8c',2);ctx.restore();}for(const [x,y]of chosen.cells){const sx=(x-ox)*S,sy=(y-oy)*S;rect(sx+3,sy+3,74,74,aim.item==='bomb'?'#eaa25450':'#a4e4e346');ctx.strokeStyle=aim.item==='bomb'?'#e9b67f':'#ceefdc';ctx.lineWidth=2;ctx.strokeRect(sx+5,sy+5,70,70);}text(aim.item==='bomb'?'投掷落点':aim.weapon?'攻击落点':'目标',(chosen.x-ox)*S+40,(chosen.y-oy)*S+14,'#fff0cb',12);

 open('camp-projects',`<div class="chest-heading"><div><span class="departure-kicker">人员与物资带回后，营地才会改变</span><h2>营地建设</h2></div><button data-action="close" aria-label="关闭">×</button>${campNoticeMarkup()}</div><div class="economy-wallet">钱币 <strong>${game.campaign.ore}</strong><button data-camp-page="camp-craft">制作工坊</button></div><label class="economy-select">当前建设目标<select id="project-focus">${Object.entries(EscapeEngine.CAMP_PROJECTS).map(([id,d])=>`<option value="${id}" ${focus===id?'selected':''}>${d.name}${game.projectComplete(id)?' · 已建成':''}</option>`).join('')}</select></label><p class="micro-note">物资可分批交付，进度永久保留。每层有一个核心主线，完成后才能深入；沿途支线与遭遇自由取舍。</p><div class="economy-list project-cards">${cards}</div>${j.deepCleared?'<p class="notice">深井炉心已经安全带回，深井探索完成。矿层与特殊装备仍会随机生成。</p>':''}<h3>已带回的人员与工程物资</h3>${projectFindsMarkup(j.finds)}<div class="shop-grid">${Object.entries(j.finds).filter(([id,n])=>n>0&&EscapeEngine.PROJECT_FINDS[id]?.value).map(([id,n])=>shopTile(EscapeEngine.PROJECT_FINDS[id].name,'库存 '+n+' · 留作建设或出售1份','+'+EscapeEngine.PROJECT_FINDS[id].value+' 钱币',`data-camp-trade="find-sell" data-trade-id="${id}"`,'◇','点击出售')).join('')}</div><div class="dialog-actions"><button data-camp-page="camp-market">超市</button><button data-action="close">返回营地</button></div>`);
}
function departurePurpose(){const j=game.journey(),id=j.focus&&!game.projectComplete(j.focus)?j.focus:Object.keys(EscapeEngine.CAMP_PROJECTS).find(id=>!game.projectComplete(id)),q=id&&game.projectState(id);return `<section class="departure-purpose"><strong>${q&&!q.complete?'营地想做：'+q.name:j.deepCleared?'寻找新的特殊装备':'向深井继续探索'}</strong><p>${esc(q&&!q.complete?q.effect:'带回深井炉心与特殊装备，收获只有撤离后才能保住。')}</p>${q&&!q.complete?'<small>尚缺：'+q.rows.filter(r=>r.paid<r.required).map(r=>esc(r.name)+' ×'+(r.required-r.paid)).join('、')+'</small>':''}${game.nextFloorIntel()?'<p>'+esc(game.nextFloorIntel())+'</p>':''}<button data-camp-page="camp-projects">查看营地建设</button></section>`;}
function campBench(page=campPage){if(game.state.expedition.phase!=='prepare')return;if(page==='camp-projects'){campProjects();return;}campPage=page;game.economyInit();const p=game.campaign,title=({'camp-market':'矿区超市','camp-craft':'制作工坊','camp-trade':'贸易收购站','camp-bench':'修理与充能'})[page]||'制作工坊';let body='';

 if(game.projectComplete('trade'))body+='<h3>商队专供</h3><div class="shop-grid">'+shopTile('动力核心','每次1枚 · 工坊、勘探台和深井设备都能使用','18 钱币',`data-camp-trade="buy-core" data-trade-id="core" ${p.ore<18?'disabled':''}`,'⚙',p.ore<18?'钱币不足':'点击购买')+'</div>';
 }else if(page==='camp-trade'){

 }else if(page==='camp-craft'){
  body=`<div class="economy-tabs"><button data-workshop-tab="craft" aria-pressed="${workshopTab==='craft'}">研制与制作</button><button data-workshop-tab="mods" aria-pressed="${workshopTab==='mods'}">装备改装</button></div>`;
  if(workshopTab==='mods'){
   const candidates=p.stock.filter(c=>game.gearModOptions(c).length);if(!candidates.some(c=>c.uid===modSelection))modSelection=candidates[0]?.uid;const c=candidates.find(c=>c.uid===modSelection);
   body+='<p>每件装备只保留一项改装；更换会覆盖，不补充耐久或燃料。</p>'+(!c?'<p>仓库没有可改装的矿镐或灯具。</p>':`<label class="economy-select">选择装备<select id="mod-equipment">${candidates.map((v,i)=>`<option value="${v.uid}" ${v.uid===c.uid?'selected':''}>${i+1}. ${esc(game.cardName(v)+' · '+cardCondition(v))}</option>`).join('')}</select></label><p>当前：${EscapeEngine.GEAR_MODS[c.data.mod]?.name||'未改装'}${c.data.mod?` <button data-camp-mod="remove" data-mod-uid="${c.uid}">免费拆除</button>`:''}</p><div class="economy-list">${game.gearModOptions(c).map(d=>economyItem(d.name,d.text+' '+materialCost(d),`<button data-camp-mod="${d.id}" data-mod-uid="${c.uid}" ${c.data.mod===d.id||p.ore<d.cost||!game.hasCampMaterials(d)?'disabled':''}>${c.data.mod===d.id?'已安装':'加工 · '+d.cost+' 钱币'}</button>`)).join('')}</div><p class="micro-note">灯具改装在穿戴时生效，放置为固定灯后按固定灯规则工作。</p>`);
  }else body+='<p>取得蓝图后支付一次研制费用，再用材料和钱币制作；营地建设也能解锁配方。</p><div class="economy-list">'+Object.entries(EscapeEngine.RAID_RECIPES).map(([id,r])=>{const locked=r.project&&!game.projectComplete(r.project);if(locked)return economyItem(r.name,'建成'+EscapeEngine.CAMP_PROJECTS[r.project].name+'后可制作',`<button disabled>需要${EscapeEngine.CAMP_PROJECTS[r.project].name}</button>`);const known=p.recipes.includes(id),found=p.blueprints.includes(id),reason=known?(p.ore<r.cost?'钱币不足':!game.hasCampMaterials(r)?'材料不足':''):!found?'缺少蓝图':p.ore<r.research?'钱币不足':'',copy=known?materialCost(r)+' · 每次制作1份':found?'蓝图已入库，研制后可反复制作':'从守卫箱或商人取得蓝图并带回';return economyItem(r.name,copy,known?`<button data-camp-trade="craft" data-trade-id="${id}" ${p.ore<r.cost||!game.hasCampMaterials(r)?'disabled':''}>制作 · ${r.cost} 钱币</button>`:`<button data-camp-trade="research" data-trade-id="${id}" ${!found||p.ore<r.research?'disabled':''}>${found?'研制 · '+r.research+' 钱币':'缺少蓝图'}</button>`,'◇',reason);}).join('')+'</div>';
 }else{
  const gear=p.stock.filter(c=>c.type==='gear');body='<p>按实际缺损报价。燃料、耐久、护甲、使用次数和缓冲层分别补充。</p><div class="economy-list">'+gear.map(c=>economyItem(game.cardName(c),cardCondition(c),game.gearRepairQuotes(c).map(q=>`<button data-stock-repair="${c.uid}" data-repair-field="${q.field}" ${p.ore<q.cost?'disabled':''}>${q.label} ${q.current}→${q.max} · ${q.cost} 钱币</button>`).join('')||'<small>状态完好</small>')).join('')+'</div>';
 }
 open(page,`<div class="chest-heading"><div><span class="departure-kicker">${page==='camp-bench'?'营地':'营地西侧 · 集市'}</span><h2>${title}</h2></div><button data-action="close" aria-label="关闭">×</button>${campNoticeMarkup()}</div><div class="economy-wallet">钱币 <strong>${p.ore}</strong><button data-materials-open="1">材料仓库</button></div><nav class="economy-tabs" aria-label="营地设施">${[['camp-market','超市'],['camp-craft','工坊'],['camp-trade','收购'],['camp-bench','维护'],['camp-projects','建设']].map(([id,label])=>`<button data-camp-page="${id}" aria-pressed="${id===page}">${label}</button>`).join('')}</nav>${body}`);
}

function supplyUseState(id){
 if(game.state.mode==='home'&&id!=='bread')return {ok:false,reason:'进入矿区后使用'};
 const def=EscapeEngine.COMMON_ITEMS[id],direct=['bread','elite_tide','torch','lamp'].includes(id)||def?.type==='supply'&&!def.range;
 if(direct)return game.itemUse(id);
 return game.itemTargets(id).length?{ok:true}: {ok:false,reason:game.itemUse(id).reason||'附近没有可用目标'};
}
function cardDetails(){const prep=game.state.expedition.phase==='prepare',c=handCards().find(c=>c.uid===(cardSelection||cardHover));if(!c)return '';let actions='';if(c.ability){const q=game.eliteActiveCheck(c.id);actions='<button data-ability-use="'+c.id+'" '+(q.ok?'':'disabled')+'>'+(q.ok?'选择目标':esc(q.reason))+'</button>';}else if(prep)actions=(c.type==='gear'||c.id==='torch'?`<button data-camp-wear="${c.uid}">穿戴 · 不占物资名额</button>`:c.type==='kit'?`<button data-camp-unpack="${c.uid}">在营地展开套装</button>`:'')+`<button data-pack-card="${c.uid}">存入箱子</button>`;else if(c.type==='kit'){const v=game.kitPreview(c.uid);actions=`<button data-kit-open="${c.uid}" ${v.ok?'':'disabled'}>使用套装${game.state.mode==='playing'?' · 1回合':''}</button>${v.ok?'':`<p>${esc(v.reason)}</p>`}`;}else if(c.id==='torch'){const q=game.equipmentChangeCheck('off','torch',c.uid),lit=(c.fuels||[EscapeEngine.LIGHTS.torch.max]).some(n=>n>0);actions=`<button data-light-equip="${c.uid}" ${q.ok&&lit?'':'disabled'}>点亮并手持 · 1回合</button><button data-light-place="torch" data-light-uid="${c.uid}" ${game.placeableLight('torch',c.uid)?'':'disabled'}>放置 · 1回合</button>`;}else if(c.type==='gear'){const q=game.equipCardCheck(c.uid);actions=`<button data-wear-instance="${c.uid}" ${q.ok?'':'disabled'}>${q.ok?'装备'+(q.advance?' · 1回合':''):esc(q.reason)}</button>${['lamp','elite_lantern'].includes(c.id)?`<button data-light-place="${c.id}" data-light-uid="${c.uid}" ${game.placeableLight(c.id,c.uid)?'':'disabled'}>放置 · 1回合</button>`:''}`;}else if(c.type==='supply'){const q=supplyUseState(c.id);actions=`<button data-card-use="${c.uid}" ${q.ok?'':'disabled'}>${esc(q.ok?(ITEM_UI[c.id]?.action||'使用')+' · 1回合':q.reason)}</button>`;}return `<div class="floating-card" data-card-kind="${c.type}" data-quality="${game.cardQuality(c)}"><button class="card-dismiss" data-card-dismiss="1" aria-label="关闭卡片详情">×</button><span class="card-type">${EscapeEngine.QUALITIES[game.cardQuality(c)].name} · ${cardType(c)}</span><div class="card-art">${cardArt(c)}</div><h3>${esc(cardDisplayName(c))}</h3><p>${esc(cardText(c))}</p><strong class="card-condition">${esc(cardCondition(c))}</strong>${gearComparisonMarkup(c)}<div class="card-actions">${actions}${game.state.mode==='playing'&&!c.ability?`<button data-card-drop="${c.uid}">放下</button>`:''}</div></div>`;}
function bagMarkup(){const prep=game.state.expedition.phase==='prepare',cards=handCards(),count=prep?cards.length:game.countSlots();return `<div class="dock-heading"><h2>卡包 <small>${count}/${prep?5:15}</small></h2>${prep?'<button data-open-chest="1">仓库</button>':'<button data-card-organize="1">整理</button>'}<button data-materials-open="1" title="矿物与原料 · 不占卡位">材料袋</button><button class="wallet-open" data-wallet-open="1" title="钱袋 · 不占卡位">钱袋 <span>${game.mineralAmount('ore')}</span></button><button data-card-position="1" title="切换卡包位置">${cardDockPosition==='side'?'移到底部':'移到侧边'}</button><button data-card-pin="1" aria-pressed="${cardDockPinned}" title="保持展开">${cardDockPinned?'已固定':'固定'}</button><button data-card-close="1" aria-label="收起卡包">×</button></div><div class="hand-spread"><div class="hand-row" role="group" aria-label="随身物品">${cards.map((c,i)=>{const offset=cards.length>1?(i/(cards.length-1)-.5)*2:0;return cardFace(c,`${c.ability?`data-ability-card="${c.id}" aria-disabled="${!game.eliteActiveCheck(c.id).ok}" title="${esc(game.eliteActiveCheck(c.id).reason||EscapeEngine.ELITE_GEAR[c.id].role)}"`:""} data-card-select="${c.uid}" aria-label="${esc(game.cardName(c)+'，'+cardCondition(c))}" aria-pressed="${c.uid===cardSelection}" style="--card-index:${i};--card-angle:0deg;--card-curve:0px;z-index:${i+1}"`,c.uid===cardSelection).replace('</button>','<span class="hand-edge-label" aria-hidden="true"><span class="hand-edge-name">'+esc(cardDisplayName(c))+'</span><span class="hand-edge-condition">'+esc(c.type==='supply'&&c.id!=='torch'?c.qty+'/3':cardCondition(c).replace(/^(耐久|燃料|次数) /,''))+'</span></span></button>');}).join('')||'<p class="empty-cards">空</p>'}</div></div>`;}
function bag(){if(dialog.open)close();cardDockOpen=!cardDockOpen;if(desktopCardDock())cardDockPinned=cardDockOpen;cardSelection=null;cardHover=null;renderCardDock();}
function intro(){if(game.state.expedition.phase==='result')ending();else renderCardDock();}
function fresh(){if(game.state.expedition.phase==='active')game.fail('主动放弃了本次探险。');if(game.state.expedition.phase==='result')game.returnToCamp();queuedAction=null;queuedMove=null;motion={events:[],end:0};cardSelection=null;loadoutSelection=null;cardNotice='';cardDockOpen=false;modal='';dialog.close();saveCampaign();sync();}
function restartPrompt(){if(game.state.expedition.phase==='prepare'){open('new-campaign',`<h2 class="dialog-title">新开局？</h2><p>将清空仓库、钱币、配方、建设进度和已救回的人员，重新开始。</p><div class="dialog-actions">${button('取消','close')}<button data-new-campaign="1" class="primary">新开局</button></div>`);return;}open('restart',`<h2 class="dialog-title">放弃本次探险？</h2><p class="dialog-copy">本次随身物资、钱币、材料和未撤出的人员与工程物资会丢失；地表仓库与已交付的建设进度保留。</p><div class="dialog-actions">${button('继续探索','close')}${button('放弃并返回营地','retry',true)}</div>`);}
function ending(){const s=game.state,r=s.expedition.result;if(!r)return;const list=r.won?r.cards:r.lost||[];open('end',`<div class="dialog-kicker">第 ${game.campaign.runs} 次下矿 · 最深第 ${r.depth||1} 层</div><h2 class="dialog-title">${r.won?'已安全撤离':'这次没能撤离'}</h2><p class="dialog-copy">${r.won?'物资按剩余次数、耐久和燃料入库。':esc(s.reason||'探险结束')+' 随身物资丢失，地表仓库与配方保留。'}</p><div class="end-stats"><span><b>${list.length}</b>${r.won?'带回物品':'损失物品'}</span><span><b>${r.won?r.ore:r.lostOre||0}</b>${r.won?'带回钱币':'损失钱币'}</span><span><b>${r.turns}</b>行动回合</span><span><b>${r.depth||1}</b>到达层数</span></div><p>${Object.entries(r.minerals||{}).filter(([,n])=>n).map(([id,n])=>esc(EscapeEngine.MINERALS[id]?.name||id)+' ×'+n).join(' · ')}</p>${r.contractReward?`<p class="notice">旧委托结算 · +${r.contractReward} 钱币</p>`:''}${r.blueprints?.length?`<p class="notice">带回蓝图：${r.blueprints.map(id=>EscapeEngine.RAID_RECIPES[id].name).join('、')} · 前往工坊研制</p>`:''}${Object.entries(r.materials||{}).length?`<p>原料：${Object.entries(r.materials).map(([id,n])=>(EscapeEngine.RAW_MATERIALS[id]?.name||id)+' ×'+n).join(' · ')}</p>`:''}${r.recipes?.length?`<p class="notice">已解锁：${r.recipes.map(id=>EscapeEngine.RAID_RECIPES[id].name).join('、')}</p>`:''}${r.finds&&Object.keys(r.finds).length?`<h3>${r.won?'带回营地的关键收获':'未能撤出的关键收获'}</h3>${projectFindsMarkup(r.finds)}${r.won?'<p>在营地工坊的「建设」中交付，可分批推进工程。</p>':''}`:''}<div class="exp-card-grid result-cards">${list.map(c=>cardFace(c,'disabled')).join('')}</div><div class="dialog-actions"><button data-return-camp="1" class="primary">返回地表营地</button></div>`);saveCampaign();}
function loot(){const s=game.state,a=s.sites.find(a=>a.id===s.lootId);if(!a?.searched||Math.max(Math.abs(a.x-s.player.x),Math.abs(a.y-s.player.y))>1||game.tile(a.x,a.y).kind==='rubble'){closeContext();return;}const entries=Object.entries(a.container||{}).filter(([,n])=>n>0),gear=a.equipment||[],cards=a.cards||[];showContext('loot',`${inventoryHeader(a.name,'卡包 '+game.countSlots()+'/15 · 放不下的留在箱中')}<div class="exp-card-grid">${a.quest?`<button class="exp-card quest-card" data-loot="quest" data-to="bag"><span class="card-type">本层任务 · 唯一</span>${itemIcon('quest')}<strong>${esc(a.quest)}</strong><span>不占卡位</span></button>`:''}${gear.map(id=>{const k=id==='pick'?'magic':id,d=GEAR[k],c={id:k,type:'gear',data:!!PICKS[d.kind]?{dur:PICKS[d.kind].max}:d.slot==='body'?{armor:d.armor}:k==='sword'?{dur:EscapeEngine.DURABILITY.sword}:k==='shield'?{dur:EscapeEngine.DURABILITY.shield}:{}};return cardFace(c,`data-loot="equipment:${id}" data-to="bag" ${c?.type==='supply'?game.capacity(c.id,'bag',c)<1?'disabled':'':game.countSlots()>=15?'disabled':''}`);}).join('')}${cards.map(c=>cardFace(c,`data-card-loot="${c.uid}" ${c?.type==='supply'?game.capacity(c.id,'bag',c)<1?'disabled':'':game.countSlots()>=15?'disabled':''}`)).join('')}${entries.map(([id,n])=>looseItemCard(id,n,`data-loot="${id}" data-to="bag"`)).join('')}</div>${!a.quest&&!gear.length&&!cards.length&&!entries.length?'<p>这里已经空了。</p>':''}<div class="dialog-actions">${game.resourcePiles('loot').length?'<button data-resource-pickup="loot" title="不耗回合，装备与补给留在原处">只收钱币与材料</button>':''}<button data-bulk="loot">全部拿取</button><button data-drawer="bag">整理卡包</button>${button('返回地图','close')}</div>`);}
function ground(){const entries=Object.entries(game.groundItems()).filter(([,n])=>n>0),near=game.nearby();showContext('ground',`${inventoryHeader('脚下的物资','卡包 '+game.countSlots()+'/15')}${game.tile(game.state.player.x,game.state.player.y).ventureFinds?'<button data-take-find="1">收取 '+esc(game.findText(game.tile(game.state.player.x,game.state.player.y).ventureFinds))+'</button>':''}<div class="exp-card-grid">${game.groundCards().map(c=>cardFace(c,`data-card-take="${c.uid}" ${c?.type==='supply'?game.capacity(c.id,'bag',c)<1?'disabled':'':game.countSlots()>=15?'disabled':''}`)).join('')}${game.groundEquipment().map((v,i)=>cardFace({id:v.id,type:'gear',data:v.data},`data-take-gear="${i}" ${game.ownsGear(v.id)||game.countSlots()>=15?'disabled':''}`)).join('')}${entries.map(([id,n])=>looseItemCard(id,n,`data-ground="${id}"`)).join('')}</div><div class="dialog-actions">${near?`<button data-ground-site="${esc(near.id)}">交互 · ${esc(near.name)}</button>`:''}${game.resourcePiles('ground').length?'<button data-resource-pickup="ground" title="不耗回合，装备与补给留在原处">只收钱币与材料</button>':''}<button data-bulk="ground">全部拿取</button><button data-drawer="bag">整理卡包</button>${button('返回地图','close')}</div>`);}
function route(){const s=game.state,a=s.sites.find(a=>a.id===s.routeChoice);if(!a){close();return;}const extracting=['extraction','mechanical'].includes(a.id),check=extracting?game.extractionCheck(a.id):game.exitCheck(),next=(s.depth||1)+1;open('route',`<div class="dialog-kicker">${extracting?'撤离回地表':'继续深入 · 第'+next+'层'}</div><h2 class="dialog-title">${esc(a.name)}</h2><p class="notice">${esc(check.reason)}。${extracting?'撤离保留随身物资及剩余状态；启动后留在原地，行动期间怪物仍会攻击。':'下一层随机生成，抵达后揭晓主题。下层不会结算，不恢复生命、次数、耐久与燃料。'}</p><div class="dialog-actions">${button('继续探索','close')}<button class="primary" data-choice="${extracting?'extract':'depart'}" ${check.ok?'':'disabled'}>${extracting?'启动撤离 · '+check.turns+'回合':'前往第'+next+'层 · 1回合'}</button></div>`);}
function help(){open('help',`<h2 class="dialog-title">下矿 · 搜寻 · 撤离</h2><dl class="help-grid"><dt>出发</dt><dd>从仓库选最多5张物资，出发后随机进入关卡。不携带钱币，地下交易使用本次所得。未展开的基础套装占一张物资卡；可在营地先展开并穿戴。已穿戴装备直接带入，不占5张手中物资名额，备用装备仍占卡位。</dd><dt>卡包</dt><dd>最多15张。装备穿戴后不占卡位，备用装备占一张；同类补给每张最多3份；选入出发物资时会补入同类未满的一组，整理同类不会混入未选择的仓库物资。火把按支保留各自燃料。钱币收入钱袋；银矿等矿物和原料收入材料袋，可出售或制作，均不占卡位。放不下的卡片留在原处。</dd><dt>照明与探索</dt><dd>火把和灯具须穿戴并有燃料才提供随身照明，放在卡包里不生效。光照随距离渐暗，岩壁与斜角挡住视线；暗处保留已探索地形的轮廓，不显示隐藏的敌人和物资。灯具技能额外耗油，使用当回合仍计照明消耗。</dd><dt>主手与副手</dt><dd>主手可选矿镐、剑、矛、斧、锤或弩。剑抓破绽，矛隔格直刺，斧扫面前三格，锤破甲打断后须收势，弩直线远射。矿镐负责挖掘，也能近战。副手可以搭配盾、火把、矿灯或钩索。备用主手各占一张卡，耐久独立；地下换装耗1回合，营地换装免费。持剑时挖矿会提示换镐，未执行的挖掘不耗回合。</dd><dt>鼠标与触屏</dt><dd>点地面沿已探索的路行走；点相邻矿壁挖一次，点武器范围内敌人攻击一次。点地点会靠近并互动，点脚下物资打开拾取。远处敌人点击查看，近处敌人用右键或长按查看；查看不耗回合。视野内有敌人时，点地面每次只走一格。自动行走遇到新敌人、危险、受伤或阻碍会停下；点停止行走、其他位置、按钮或按键也会中止。点卡牌使用后，再点高亮目标出手。</dd><dt>键盘与方向按钮</dt><dd>原操作保留：方向键/WASD移动、挖掘与攻击，空格互动，I卡包，E装备，G脚下物资；手机方向按钮也可继续使用。物品与战技仍可用方向键选目标、确认出手。</dd><dt>武器动作</dt><dd>点击行动栏的武器按钮或按F，预览范围后选目标；取消不耗回合。攻击耗1回合，剑／矛／弩耗1耐久，斧／锤／矿镐耗2；横扫命中多敌也只扣一次，敲泥土魔物按采掘消耗。被硬壳挡住仍会磨损。弩贴身也是射击，射后手动装填耗1回合、不另耗耐久；没有独立箭矢物资。移动、换装和等待不会装填。空弩点敌人不会自动装填。锤击后须再行动一次，移动或用物品即可完成收势，也能点收势按钮原地完成。</dd><dt>时间</dt><dd>查看、选目标和整理不耗回合。地下使用补给、装备技能（含钩索与披风）、展开套装和换装均推进1回合；只有迅捷敌人可在动作前先手。药效会参与使用当回合的结算，剩余次数不会因下层或重载恢复。营地维修不推进回合，随身灯具在营地停止耗油；睡觉仍推进8回合。</dd><dt>撤离</dt><dd>入口附近升降机：启动后原地坚持3回合，可以攻击或使用物品，走开会中止。完成本层主线后，可从机械出口1回合撤离。最后一回合仍须存活。</dd><dt>本层主线</dt><dd>每层随机一个核心目标：救回工匠或医师、取得动力核心或勘探仪、运回商队货车、回收深井组件、夺取封存装备。地图围绕主线生成，完成后才能深入。救人需带回入口营地，货车需运抵接应点，武器库须击败守库精英；拆下核心会令机房熄灯。线索只帮助定位，发现实物可直接处理。</dd><dt>支线与遭遇</dt><dd>工具柜、药箱、额外救援及沿途商人、怪群、物资点等自由取舍。收获可用于补给、营地建设或交易，但不会替代本层主线，也不要求清空地图。</dd><dt>营地建设</dt><dd>人员和工程物资独立保管，成功撤离后入库，失败会失去本次收获。工坊、药台、勘探台、贸易和深井设备可分批建设，已交付进度永久保存。查看工坊的建设页即可交付。修复深井设备后，第三层起可以发现深井守卫。</dd><dt>深入</dt><dd>完成本层主线后，下行通路解锁。下一层主题、发现和布局重新随机，主题可能重复。全部未结算收获与剩余状态继续携带。每层都有基础升降机。</dd><dt>营地</dt><dd>营地左侧相连的区域设有超市、制作工坊和贸易收购站，直接走过去即可使用。蓝图带回后研制，再消耗材料制作；装备可以进行一项有取舍的改装。完成主线或取得关键收获并安全撤离后更新集市货物和收购需求。矿内营地只提供当地休整。</dd><dt>失败</dt><dd>死亡或放弃丢失随身物资，地表仓库和配方保留。营地可变现资产不足6钱币且没有可用主手装备或基础套装时提供基础套装；不足2钱币且缺面包时提供面包。物资需手动携带与使用。</dd></dl>${finish()}`);}
