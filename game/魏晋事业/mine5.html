<body><main class="game">

const button=(label,action,primary=false)=>`<button ${primary?'class="primary" ':''}data-action="${action}">${label}</button>`;

function modList(){const s=game.state;return s.mods.map(id=>({id,...GEN.MUTATORS[id]}))}
function intro(){open('intro',`<div class="intro-art"></div><div class="dialog-kicker">剑与魔法 · 地下逃生</div><h2 class="dialog-title">深处，也许有生路。</h2><p class="dialog-copy">归路被矿难封死。带上镐和灯，循着旧轨道、水迹与回声调查矿区。你可以搜刮补给、救出同伴、挖开近路，寻找继续前进的通道。</p><p class="notice">方向键走动、挖掘、攻击；空格与身边事物互动。<br>物品先拿到手上，再按1 / 2使用。查看说明和整理物品时，怪物不会行动。<br>新增：银矿引怪、符石冻水、三章机关与同伴援助。支路奖励可先看清，再决定是否冒险。<br>离线 Demo，刷新后重新开始。</p>${finish('在营地醒来')}`)}
function runInfo(){const s=game.state;const rows=s.regions.filter(r=>s.visitedRegions.includes(r.index)).map(r=>{let seen=0,total=0;for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++){const t=game.tile(x,y);if(t?.region!==r.index||!GEN.passableKind(t.kind))continue;total++;if(t.seen)seen++}return `<div class="inventory-row"><b>${esc(r.name)}</b><small>已见 ${seen} 格</small></div>`}).join('');open('run',`<div class="dialog-kicker">本局 ${s.code}</div><h2 class="dialog-title">旅途状况</h2><p class="dialog-copy">${modList().map(m=>'<b>'+m.name+'</b>：'+m.desc).join('<br>')||'普通矿区'}</p><p class="notice">${s.phase==='evacuate'?'矿洞正在塌陷，找到离开本区的通路后尽快出发。':'还能继续探索。发现地面开裂时，尽快离开裂缝。'}</p><div class="inventory-list">${rows||'还未离开营地'}</div>${finish()}`)}
function help(){open('help',`<div class="dialog-kicker">随身指南</div><h2 class="dialog-title">怎么行动，怎么活下来。</h2><dl class="help-grid"><dt>行动</dt><dd>按方向键或WASD，朝空地走、朝岩石挖、朝怪物攻击。空格与旁边的东西互动。你行动时怪物也会行动；查看地图、线索和物品说明时，它们不会动。</dd><dt>双手</dt><dd>先点背包物品，再选拿到主手或副手。点击下方拿着它的手，或按1 / 2使用。矿镐、剑、火把、盾牌拿在手上就会生效。换手时怪物也能行动，营地里可以随时换。</dd><dt>探索</dt><dd>右侧目标告诉你眼下要找什么。沿轨道、油痕、水迹和声音调查；出口要亲自找到。M看已走过的地图，J看线索，点击一条线索可把它设为当前目标。</dd><dt>搜刮</dt><dd>走到容器旁按空格翻找，附近怪物也会趁此行动。找到物品后可以慢慢挑选，不再耽搁时间。装不下的会留在原处。地上物资用空格捡起，G逐件挑选。</dd><dt>道具</dt><dd>火把拿在手上就会亮，再点会插到地上。绳索要站在水边、面向对岸使用。炸药引线只够你再移动两次，换手和做其他事也会烧掉引线。放下后先走出橙色标记。符石能让眼前怪物暂时停住。</dd><dt>新办法</dt><dd>银矿可以手持投出，引开听觉敏锐的怪物，再绕行或布置炸药。符石还可冻结水面；绳索能把冰桥固定成永久通路。所有成功使用都会推进1回合。</dd><dt>三章</dt><dd>矿区留意爆破裂缝；矮人城可用双向绞盘改变近路；地下河浅滩每8回合涨落一次，涨水前2回合会提醒，高岸始终能绕行。</dd><dt>支洞</dt><dd>旧铭牌提前说明奖励与代价。打开入口才开始16回合倒计时，取走特殊装备便能稳住物资龛。拿不拿由你决定。</dd><dt>同伴</dt><dd>矿工延缓附近塌落8回合，石匠打开封岩捷径，渡工免费架起最多5格的永久渡绳。右侧按钮在条件满足时亮起；每人每章一次，抵达营地后会加入同行队伍。</dd><dt>护甲</dt><dd>护甲先替你承受伤害，用完后才会扣生命；幽灵能直接伤到生命。工作台可以补好护甲。矿镐耐久耗尽会挖得更慢，也无法攻击大多数怪物，记得修理。</dd><dt>营地</dt><dd>点床可以吃面包睡一觉，恢复生命；面包要先拿在手上。点工作台花银矿修装备。休息和修理都会耽搁撤离，营地快塌时要从出口离开。</dd><dt>危险</dt><dd>脚下出现红色裂缝就尽快走开。塌下来的碎石可以绕过，也能用镐挖开。听见声音时只会短暂提示方向，墙后的地形仍然看不见。</dd><dt>怪物</dt><dd>留意地上的攻击标记，及时走开。亡骸已经举起镐时，逃跑、换手或用物品都会先挨一锤；只能抢先攻击，一击打不倒它仍会受伤。点怪物或按C可看它的习性。</dd><dt>照明</dt><dd>火把或矿帽让你看得更远。把火把插下后，它只照亮原地。Z拉近或拉远视野；I选中背包，Esc收起当前操作。</dd></dl>${finish()}`)}

 const cell=full?Math.max(4,Math.floor(340/SIZE)):12,span=full?SIZE:Math.min(SIZE,Math.ceil(340/cell));

  btns[cur<0?(back>0?0:btns.length-1):(cur+back+btns.length)%btns.length].focus({preventScroll:true});return}
 if(k==='enter'||k===' '){const focused=document.activeElement;
  if(focused&&focused.tagName==='BUTTON'&&content.contains(focused))return;
  e.preventDefault();const b=content.querySelector('button.primary:not([disabled])')||btns[0];if(b)b.click();return}
 if(/^[1-9]$/.test(k)){const b=btns[Number(k)-1];if(b){e.preventDefault();b.click()}return}
 if(k==='z'){e.preventDefault();zoom=zoom<1?1:.5;return}
 if(PANELKEYS[k]){e.preventDefault();showPanel(PANELKEYS[k])}
}
window.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
 if(dialog.open){if(e.repeat&&[' ','enter','1','2','3','4','5','6','7','8','9'].includes(k)){e.preventDefault();return}dialogKeys(e,k);return}
 if((k===' '||k==='enter')&&e.target.closest?.('#bag-content,#context-panel,#hand-options')){if(e.repeat)e.preventDefault();return}
 if(k==='escape'){if(bagHand!==null){bagHand=null;renderBag()}else if(game.state.panel)closeContext();canvas.focus({preventScroll:true});return}
 if(DIRKEYS[k]){e.preventDefault();if(e.repeat&&holdBlocked)return;if(!e.repeat)holdBlocked=false;const now=performance.now();if(e.repeat&&now-lastMove<150)return;lastMove=now;move(...DIRKEYS[k]);return}
 if(e.repeat){if(k===' '||k==='enter')e.preventDefault();return}
 if(k===' ')interactHere();
 else if(k==='.'||k==='5')act({type:'wait'});
 else if(k==='1'||k==='2')useHand(Number(k)-1);
 else if(k==='g')act({type:'pickup'});
 else if(k==='c')inspectNearest();
 else if(['b','f','t','r'].includes(k))act({type:'use',item:({b:'bread',f:'bomb',t:'torch',r:'rope'})[k]});
 else if(k==='z'){zoom=zoom<1?1:.5;sync()}
 else if(PANELKEYS[k])showPanel(PANELKEYS[k]);
 else return;
 e.preventDefault();
});

resizeCanvas();sync();intro();requestAnimationFrame(draw);
})();
</script></body></html>
