<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <title>贪吃蛇</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #faf8ef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    * {
      box-sizing: border-box;
    }
    .wrapper {
      text-align: center;
      padding: 8px;
    }
    .top {
      margin-bottom: 10px;
    }
    .top h1 {
      margin: 0;
      font-size: 28px;
      color: #776e65;
      letter-spacing: 3px;
    }
    .score-row {
      margin-top: 4px;
      font-size: 14px;
      color: #776e65;
    }
    .score-row span {
      font-weight: 700;
      margin: 0 2px;
    }

    :root {
      --tile-size: min(32px, 4vw);
    }

    .grid {
      background: #bbada0;
      padding: calc(var(--tile-size) * 0.3);
      border-radius: 6px;
      display: inline-grid;
      grid-template-columns: repeat(20, var(--tile-size));
      grid-template-rows: repeat(20, var(--tile-size));
      gap: calc(var(--tile-size) * 0.18);
      box-shadow: 0 8px 20px rgba(187, 173, 160, 0.8);
      transition: transform 0.18s ease;
      touch-action: none;
    }

    .cell {
      width: var(--tile-size);
      height: var(--tile-size);
      border-radius: 4px;
      background: #cdc1b4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--tile-size) * 0.6);
      font-weight: 700;
      color: #f9f6f2;
      transition: background 0.1s ease, transform 0.1s ease, box-shadow 0.1s ease;
      box-shadow: 0 2px 3px rgba(119, 110, 101, 0.35);
    }
    .cell.empty {
      background: #cdc1b4;
      color: transparent;
      box-shadow: none;
    }
    .cell.food {
      background: #f65e3b;
      box-shadow: 0 3px 6px rgba(246, 94, 59, 0.7);
      animation: food-pop 0.24s ease-out;
    }
    .cell.food::before {
      content: "🍎";
    }
    .cell.snake-body {
      background: #8f7a66;
      box-shadow: 0 3px 6px rgba(143, 122, 102, 0.7);
    }
    .cell.snake-head {
      background: #f2b179;
      box-shadow: 0 0 0 3px rgba(249, 246, 242, 0.5),
                  0 3px 6px rgba(242, 177, 121, 0.8);
      position: relative;
    }
    .cell.snake-head::before,
    .cell.snake-head::after {
      content: "";
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 999px;
      background: #776e65;
      top: 28%;
    }
    .cell.snake-head::before {
      left: 28%;
    }
    .cell.snake-head::after {
      right: 28%;
    }

    @keyframes food-pop {
      0% { transform: scale(0); }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .grid.shake {
      animation: grid-shake 0.22s ease-out;
    }
    @keyframes grid-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      50% { transform: translateX(4px); }
      75% { transform: translateX(-3px); }
    }

    .status {
      margin-top: 8px;
      font-size: 13px;
      min-height: 18px;
      color: #776e65;
    }
    .tip {
      margin-top: 4px;
      font-size: 12px;
      color: #999;
    }

    @media (max-width: 480px) {
      :root {
        --tile-size: min(24px, 4.2vw);
      }
      .top h1 {
        font-size: 24px;
      }
      .score-row {
        font-size: 13px;
      }
      .tip {
        font-size: 11px;
      }
    }
  
    html { display: block; }
    body { width: 100%; height: auto; min-height: 100dvh; }
    .wrapper { width: 100%; max-width: 900px; padding: 12px; }
    :root { --tile-size: min(32px, calc((100vw - 32px) / 24.02), calc((100dvh - 206px) / 24.02)); }
    .grid { user-select: none; }
    .status, .tip { line-height: 1.45; overflow-wrap: anywhere; }
    .game-controls { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
    .game-controls button { min-height: 44px; padding: 8px 16px; border: 0; border-radius: 6px; background: #8f7a66; color: #fff; font: inherit; cursor: pointer; touch-action: manipulation; }
    @media (max-height: 480px) and (min-width: 540px) {
      :root { --tile-size: min(32px, calc((100dvh - 28px) / 24.02), calc((100vw - 300px) / 24.02)); }
      .wrapper { display: grid; grid-template-columns: auto 240px; justify-content: center; align-items: center; column-gap: 20px; }
      .grid { grid-column: 1; grid-row: 1 / 5; }
      .top, .status, .game-controls, .tip { grid-column: 2; }
      .top { margin-bottom: 0; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="top">
    <h1>贪吃蛇</h1>
    <div class="score-row">
      分数：<span id="score">0</span>
      · 长度：<span id="length">0</span>
      · 最高：<span id="best">0</span>
      · 速度：<span id="speed-text">悠闲</span>
    </div>
  </div>

  <div id="grid" class="grid"></div>

  <div id="status" class="status"></div>
  <div class="game-controls"><button type="button" id="play-pause">开始 / 暂停</button><button type="button" id="restart">重新开始</button></div>
  <div class="tip">
    按任意键开始 / 空格暂停 | 方向键 / WASD 控制 | 手机滑动控制方向
  </div>
</div>

<script>
  // ====== 基础配置 ======
  const ROWS = 20;
  const COLS = 20;
  const INIT_LEN = 4;      // 初始长度
  const COMBO_WINDOW = 4000; // 4 秒内连续吃算连吃
  const BEST_KEY = "snake_best_v1";

  const gridEl = document.getElementById("grid");
  const scoreEl = document.getElementById("score");
  const lengthEl = document.getElementById("length");
  const bestEl = document.getElementById("best");
  const speedTextEl = document.getElementById("speed-text");
  const statusEl = document.getElementById("status");

  // 游戏状态
  let snake = [];
  let direction = { x: 1, y: 0 }; // 当前移动方向（右）
  let nextDir = null;             // 帧间待更新方向
  let food = null;
  let score = 0;
  let bestScore = 0;
  let gameState = "ready";        // "ready" | "running" | "paused" | "over"
  let tickTimer = null;

  // 连吃 / 提示
  let combo = 0;
  let bestCombo = 0;
  let lastEatTime = 0;
  let baseStatusText = "";
  let statusTimeoutId = null;

  // 触摸
  let touchStartX = 0;
  let touchStartY = 0;

  // ====== 音效 ======
  let audioCtx;
  function playBeep(freq = 440, duration = 0.08, type = "square", volume = 0.08, delay = 0) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) audioCtx = new AC();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const startTime = audioCtx.currentTime + delay;
      gain.gain.setValueAtTime(volume, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

      osc.start(startTime);
      osc.stop(startTime + duration);
    } catch (e) {
      console.error("音效播放失败", e);
    }
  }

  function moveSound() {
    playBeep(260, 0.04, "square", 0.04);
  }
  function eatSound() {
    playBeep(520, 0.07, "triangle", 0.08);
    playBeep(760, 0.07, "triangle", 0.08, 0.05);
  }
  function gameOverSound() {
    playBeep(240, 0.16, "sawtooth", 0.1);
    playBeep(160, 0.22, "sine", 0.12, 0.08);
  }

  // ====== 工具函数 ======
  function coordKey(r, c) {
    return r + "," + c;
  }

  function randomEmptyCell() {
    const occupied = new Set(snake.map(seg => coordKey(seg.r, seg.c)));
    const empties = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const key = coordKey(r, c);
        if (!occupied.has(key)) {
          empties.push({ r, c });
        }
      }
    }
    if (!empties.length) return null;
    const idx = Math.floor(Math.random() * empties.length);
    return empties[idx];
  }

  function loadBestScore() {
    try {
      const raw = localStorage.getItem(BEST_KEY);
      if (raw) {
        const v = parseInt(raw, 10);
        if (!Number.isNaN(v)) bestScore = v;
      }
    } catch (e) {
      bestScore = 0;
    }
    bestEl.textContent = bestScore;
  }

  function saveBestScore() {
    try {
      localStorage.setItem(BEST_KEY, String(bestScore));
    } catch (e) {
      console.warn("保存最高分失败", e);
    }
  }

  function setBaseStatus(text, color = "#776e65") {
    baseStatusText = text;
    if (!statusTimeoutId) {
      statusEl.textContent = text;
      statusEl.style.color = color;
    } else {
      // 目前有高优先级提示在显示，等它结束后会恢复 base 文本
    }
  }

  function flashStatus(text, color = "#f97316", duration = 900) {
    if (statusTimeoutId) clearTimeout(statusTimeoutId);
    statusTimeoutId = null;
    statusEl.textContent = text;
    statusEl.style.color = color;
    statusTimeoutId = setTimeout(() => {
      statusTimeoutId = null;
      statusEl.textContent = baseStatusText;
      statusEl.style.color = "#776e65";
    }, duration);
  }

  function updateStats() {
    scoreEl.textContent = score;
    lengthEl.textContent = snake.length;
    bestEl.textContent = bestScore;
    speedTextEl.textContent = getSpeedLabel();
  }

  function getSpeedLabel() {
    const len = snake.length;
    if (len <= 6) return "悠闲";
    if (len <= 12) return "普通";
    if (len <= 18) return "偏快";
    return "疯狂";
  }

  // 速度随长度变快
  function getIntervalByLength() {
    const len = snake.length;
    const extra = Math.max(0, len - INIT_LEN);
    const base = 200;      // 初始间隔（毫秒）
    const per = 3;         // 每长一节减少的间隔
    const min = 80;        // 最快
    let interval = base - extra * per;
    if (interval < min) interval = min;
    return interval;
  }

  // ====== 棋盘构建 & 渲染 ======
  function buildGrid() {
    gridEl.innerHTML = "";
    gridEl.style.gridTemplateColumns = `repeat(${COLS}, var(--tile-size))`;
    gridEl.style.gridTemplateRows = `repeat(${ROWS}, var(--tile-size))`;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement("div");
        cell.className = "cell empty";
        cell.dataset.row = r;
        cell.dataset.col = c;
        gridEl.appendChild(cell);
      }
    }
  }

  function renderScene() {
    const cells = gridEl.children;
    const snakeMap = new Map();
    snake.forEach((seg, idx) => {
      snakeMap.set(coordKey(seg.r, seg.c), idx);
    });

    for (let i = 0; i < cells.length; i++) {
      const cell = cells[i];
      const r = parseInt(cell.dataset.row, 10);
      const c = parseInt(cell.dataset.col, 10);
      const key = coordKey(r, c);

      cell.className = "cell empty";
      cell.textContent = "";

      // 食物
      if (food && food.r === r && food.c === c) {
        cell.className = "cell food";
        continue;
      }

      // 蛇
      if (snakeMap.has(key)) {
        const idxInSnake = snakeMap.get(key);
        if (idxInSnake === 0) {
          cell.className = "cell snake-head";
        } else {
          cell.className = "cell snake-body";
        }
      }
    }
  }

  // ====== 游戏流程 ======
  function resetGame() {
    const midR = Math.floor(ROWS / 2);
    const midC = Math.floor(COLS / 2) - 1;

    snake = [
      { r: midR, c: midC + 1 }, // 头
      { r: midR, c: midC },
      { r: midR, c: midC - 1 },
      { r: midR, c: midC - 2 }
    ];
    direction = { x: 1, y: 0 };
    nextDir = null;
    food = randomEmptyCell();
    score = 0;
    combo = 0;
    bestCombo = 0;
    lastEatTime = 0;

    if (tickTimer) {
      clearInterval(tickTimer);
      tickTimer = null;
    }
    gameState = "ready";
    gridEl.classList.remove("shake");

    setBaseStatus("滑动 / 按任意键开始，方向键 / WASD 控制");
    updateStats();
    renderScene();
  }

  function startLoop() {
    if (tickTimer) {
      clearInterval(tickTimer);
      tickTimer = null;
    }
    const interval = getIntervalByLength();
    tickTimer = setInterval(gameTick, interval);
  }

  function startGame() {
    if (gameState === "running") return;
    gameState = "running";
    setBaseStatus("小心别撞到墙和自己的身体～");
    startLoop();
  }

  function togglePause() {
    if (gameState === "running") {
      gameState = "paused";
      if (tickTimer) {
        clearInterval(tickTimer);
        tickTimer = null;
      }
      setBaseStatus("已暂停，点击开始 / 暂停或按空格继续");
    } else if (gameState === "paused") {
      gameState = "running";
      setBaseStatus("小心别撞到墙和自己的身体～");
      startLoop();
    }
  }

  function onGameOver() {
    gameState = "over";
    if (tickTimer) {
      clearInterval(tickTimer);
      tickTimer = null;
    }
    gridEl.classList.add("shake");
    setBaseStatus(
      "游戏结束，本局最大连吃 x" + bestCombo + "，按任意键再来一局",
      "#ef4444"
    );
    gameOverSound();
    setTimeout(() => {
      gridEl.classList.remove("shake");
    }, 260);
  }

  function applyDirection(dx, dy) {
    // 不允许直接反向
    const opposite =
      (direction.x === 1 && dx === -1) ||
      (direction.x === -1 && dx === 1) ||
      (direction.y === 1 && dy === -1) ||
      (direction.y === -1 && dy === 1);
    if (opposite && snake.length > 1) return;
    nextDir = { x: dx, y: dy };
  }

  function gameTick() {
    if (gameState !== "running") return;

    if (nextDir) {
      direction = nextDir;
      nextDir = null;
    }

    const head = snake[0];
    const newR = head.r + direction.y;
    const newC = head.c + direction.x;

    // 撞墙
    if (newR < 0 || newR >= ROWS || newC < 0 || newC >= COLS) {
      onGameOver();
      return;
    }

    // 撞自己
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].r === newR && snake[i].c === newC) {
        onGameOver();
        return;
      }
    }

    // 移动
    snake.unshift({ r: newR, c: newC });

    // 吃到食物
    if (food && newR === food.r && newC === food.c) {
      eatSound();
      const now = Date.now();
      if (lastEatTime && now - lastEatTime <= COMBO_WINDOW) {
        combo++;
      } else {
        combo = 1;
      }
      lastEatTime = now;
      if (combo > bestCombo) bestCombo = combo;

      const baseGain = 10;
      const comboBonus = (combo - 1) * 5;
      const gain = baseGain + comboBonus;
      score += gain;

      // 最高分
      if (score > bestScore) {
        bestScore = score;
        saveBestScore();
        flashStatus("新纪录！当前分数 " + score, "#22c55e", 1200);
      } else if (combo >= 2) {
        flashStatus(
          "连吃 x" + combo + "  +" + gain + " 分",
          "#f97316",
          900
        );
      }

      food = randomEmptyCell();
      updateStats();
      renderScene();
      // 长度变长 → 重新根据长度调整速度
      startLoop();
    } else {
      // 没吃到，正常前进
      snake.pop();
      moveSound();
      renderScene();
    }
  }

  // ====== 键盘 & 触摸控制 ======
  function handleKeydown(e) {
    const key = e.key;
    if (key.startsWith("Arrow") || key === " ") e.preventDefault();

    let startedThisKey = false;

    // 任意键开始 / 结束后任意键重开
    if (gameState === "ready") {
      startGame();
      startedThisKey = true;
    } else if (gameState === "over") {
      resetGame();
      startGame();
      startedThisKey = true;
    }

    // 空格：暂停/继续
    if (key === " " || key === "Spacebar") {
      // 避免第一下空格刚开始就立即暂停
      if (!startedThisKey) {
        togglePause();
      }
      return;
    }

    // 方向键 / WASD
    if (key === "ArrowUp" || key === "w" || key === "W") {
      applyDirection(0, -1);
    } else if (key === "ArrowDown" || key === "s" || key === "S") {
      applyDirection(0, 1);
    } else if (key === "ArrowLeft" || key === "a" || key === "A") {
      applyDirection(-1, 0);
    } else if (key === "ArrowRight" || key === "d" || key === "D") {
      applyDirection(1, 0);
    }
  }

  // 手机滑动：同样支持“第一次滑动就开始游戏”
  gridEl.addEventListener(
    "touchstart",
    e => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;

      if (gameState === "ready") {
        startGame();
      } else if (gameState === "over") {
        resetGame();
        startGame();
      }
    },
    { passive: true }
  );

  gridEl.addEventListener("touchend", e => {
    if (e.changedTouches.length !== 1) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx);
    const absY = Math.abs(dy);
    const threshold = 20;
    if (absX < threshold && absY < threshold) return;

    if (absX > absY) {
      // 水平
      if (dx > 0) applyDirection(1, 0);
      else applyDirection(-1, 0);
    } else {
      // 垂直
      if (dy > 0) applyDirection(0, 1);
      else applyDirection(0, -1);
    }
  });

  document.getElementById("play-pause").addEventListener("click", () => {
    if (gameState === "ready" || gameState === "over") {
      if (gameState === "over") resetGame();
      startGame();
    } else togglePause();
  });
  document.getElementById("restart").addEventListener("click", resetGame);

  // ====== 初始化 ======
  window.addEventListener("keydown", handleKeydown);

  buildGrid();
  loadBestScore();
  resetGame();
</script>
</body>
</html>
