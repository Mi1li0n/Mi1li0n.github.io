<body>
<main>
  <header class="intro"><div><p class="eyebrow">ARCADE / 03</p><h1>打砖块</h1></div><span class="tag">接住每一次反弹</span></header>
  <p class="subtitle">移动挡板，清空彩色砖墙。接住道具，让下一波更轻松。</p>
  <section class="stats" aria-label="游戏数据">
    <div class="stat"><span>得分</span><strong id="score">0</strong></div>
    <div class="stat"><span>生命</span><strong id="lives">3</strong></div>
    <div class="stat"><span>波次</span><strong id="wave">1</strong></div>
    <div class="stat"><span>最佳</span><strong id="best">0</strong></div>
  </section>
  <div class="board-wrap">
    <canvas id="board" width="400" height="520" tabindex="0" aria-label="打砖块游戏区域，用左右方向键或 A、D 移动挡板，空格发球或暂停"></canvas>
    <div class="overlay" id="overlay"><div class="message"><strong id="overlay-title">准备发球</strong><p id="overlay-detail">先移动挡板找到位置<br>点击「发球」开始</p></div></div>
  </div>
  <div class="controls"><button id="launch" class="primary" type="button">发球</button><button id="pause" type="button" disabled>暂停</button><button id="restart" type="button">重新开始</button></div>
  <p class="status" id="status" aria-live="polite">第 1 波 · 准备发球</p>
  <section class="guide" aria-label="玩法说明"><p><b>操作</b>：← → / A D 移动；空格发球、暂停。触屏或鼠标在球场内拖动挡板。失去 3 条生命后结束。</p><div class="legend"><span><b class="symbol">↔</b> 挡板加宽 10 秒</span><span><b class="symbol">◷</b> 慢速球 10 秒</span><span><b class="symbol">♥</b> +1 生命（最多 5）</span></div></section>
  <p class="footer">离开页面会自动暂停 · 返回后点击继续</p>
</main>
<script id="game-core">
(() => {
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  class BreakoutGame {
    constructor({ rng = Math.random } = {}) { this.rng = rng; this.width = 400; this.height = 520; this.restart(); }
    restart() { this.score = 0; this.lives = 3; this.wave = 1; this.paddle = { x: 200, y: 482, w: 80, h: 12 }; this.prepareWave(); }
    prepareWave() {
      this.baseSpeed = Math.min(235 + (this.wave - 1) * 18, 370);
      const rows = Math.min(3 + this.wave, 7);
      this.bricks = [];
      for (let row = 0; row < rows; row++) for (let col = 0; col < 7; col++) this.bricks.push({ x: 18 + col * 53, y: 48 + row * 26, w: 46, h: 18, row, alive: true });
      this.resetBall();
    }
    resetBall() {
      this.status = 'ready'; this.drops = []; this.wideTime = 0; this.slowTime = 0; this.paddle.w = 80;
      this.movePaddle(this.paddle.x); this.ball = { x: this.paddle.x, y: this.paddle.y - 9, r: 6, vx: 0, vy: 0 };
    }
    movePaddle(x) { this.paddle.x = clamp(x, this.paddle.w / 2 + 4, this.width - this.paddle.w / 2 - 4); if (this.status === 'ready' && this.ball) this.ball.x = this.paddle.x; }
    launch() { if (this.status !== 'ready') return; this.status = 'playing'; this.ball.vx = this.baseSpeed * 0.35; this.ball.vy = -this.baseSpeed * Math.sqrt(1 - 0.35 ** 2); }
    pause() { if (this.status === 'playing') this.status = 'paused'; }
    resume() { if (this.status === 'paused') this.status = 'playing'; }
    setSpeed(speed) { const length = Math.hypot(this.ball.vx, this.ball.vy); if (length) { this.ball.vx *= speed / length; this.ball.vy *= speed / length; } }
    collect(type) {
      if (type === 'wide') { this.wideTime = 10; this.paddle.w = 120; this.movePaddle(this.paddle.x); }
      if (type === 'slow') { this.slowTime = 10; this.setSpeed(this.baseSpeed * 0.65); }
      if (type === 'life') this.lives = Math.min(5, this.lives + 1);
    }
    step(seconds) {
      if (this.status !== 'playing' || !Number.isFinite(seconds) || seconds <= 0) return;
      const dt = Math.min(seconds, 0.05), steps = Math.max(1, Math.ceil(dt / (1 / 240))), sub = dt / steps;
      for (let i = 0; i < steps && this.status === 'playing'; i++) this.tick(sub);
    }
    tick(dt) {
      if (this.wideTime > 0) { this.wideTime = Math.max(0, this.wideTime - dt); if (!this.wideTime) { this.paddle.w = 80; this.movePaddle(this.paddle.x); } }
      if (this.slowTime > 0) { this.slowTime = Math.max(0, this.slowTime - dt); if (!this.slowTime) this.setSpeed(this.baseSpeed); }
      const b = this.ball, p = this.paddle, prevX = b.x, prevY = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
      if (b.x > this.width - b.r) { b.x = this.width - b.r; b.vx = -Math.abs(b.vx); }
      if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
      if (b.vy > 0 && prevY + b.r <= p.y && b.y + b.r >= p.y && b.x + b.r >= p.x - p.w / 2 && b.x - b.r <= p.x + p.w / 2) {
        b.y = p.y - b.r - 0.01;
        const angle = clamp((b.x - p.x) / (p.w / 2), -1, 1) * 1.05;
        const speed = this.baseSpeed * (this.slowTime > 0 ? 0.65 : 1);
        b.vx = Math.sin(angle) * speed; b.vy = -Math.cos(angle) * speed;
      }
      for (const brick of this.bricks) {
        if (!brick.alive) continue;
        const nearestX = clamp(b.x, brick.x, brick.x + brick.w), nearestY = clamp(b.y, brick.y, brick.y + brick.h);
        if ((b.x - nearestX) ** 2 + (b.y - nearestY) ** 2 > b.r ** 2) continue;
        brick.alive = false; this.score += 10;
        if (prevY - b.r >= brick.y + brick.h) { b.y = brick.y + brick.h + b.r + 0.01; b.vy = Math.abs(b.vy); }
        else if (prevY + b.r <= brick.y) { b.y = brick.y - b.r - 0.01; b.vy = -Math.abs(b.vy); }
        else if (prevX - b.r >= brick.x + brick.w) { b.x = brick.x + brick.w + b.r + 0.01; b.vx = Math.abs(b.vx); }
        else if (prevX + b.r <= brick.x) { b.x = brick.x - b.r - 0.01; b.vx = -Math.abs(b.vx); }
        else {
          const distances = [Math.abs(b.y - (brick.y - b.r)), Math.abs(b.y - (brick.y + brick.h + b.r)), Math.abs(b.x - (brick.x - b.r)), Math.abs(b.x - (brick.x + brick.w + b.r))];
          const side = distances.indexOf(Math.min(...distances));
          if (side === 0) { b.y = brick.y - b.r - 0.01; b.vy = -Math.abs(b.vy); }
          if (side === 1) { b.y = brick.y + brick.h + b.r + 0.01; b.vy = Math.abs(b.vy); }
          if (side === 2) { b.x = brick.x - b.r - 0.01; b.vx = -Math.abs(b.vx); }
          if (side === 3) { b.x = brick.x + brick.w + b.r + 0.01; b.vx = Math.abs(b.vx); }
        }
        if (this.rng() < 0.25) this.drops.push({ x: brick.x + brick.w / 2, y: brick.y + brick.h / 2, type: ['wide', 'slow', 'life'][Math.min(2, Math.floor(this.rng() * 3))] });
        break;
      }
      this.drops = this.drops.filter(drop => {
        drop.y += 110 * dt;
        if (drop.y + 9 >= p.y && drop.y - 9 <= p.y + p.h && drop.x + 9 >= p.x - p.w / 2 && drop.x - 9 <= p.x + p.w / 2) { this.collect(drop.type); return false; }
        return drop.y < this.height + 12;
      });
      if (!this.bricks.some(brick => brick.alive)) { this.wave++; this.prepareWave(); return; }
      if (b.y - b.r > this.height) { this.lives--; if (this.lives <= 0) this.status = 'over'; else this.resetBall(); }
    }
  }
  globalThis.BreakoutGame = BreakoutGame;
})();
</script>
<script>
(() => {
  'use strict';
  const game = new BreakoutGame(), canvas = document.getElementById('board'), ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id), keys = new Set(), palette = ['#61f4d7','#64d6ff','#ffcd68','#ff7c94','#aa9bff','#45dfbf','#c4ed6d'];
  let best = 0, lastTime = 0, pointerId = null, shownStatus = '', savedScore = 0;
  const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
  let particles = [], rings = [], trail = [], banner = null, paddleFlash = 0, sceneTime = 0;
  const dropColors = {wide:'#61f4d7',slow:'#64d6ff',life:'#ff7c94'};
  function clearFeedback() { particles=[];rings=[];trail=[];banner=null;paddleFlash=0; }
  motionQuery.addEventListener('change',clearFeedback);
  function burst(x,y,color,count=9) {
    if(motionQuery.matches)return;
    rings.push({x,y,color,age:0});rings=rings.slice(-10);
    for(let i=0;i<count;i++){const angle=Math.PI*2*i/count;particles.push({x,y,vx:Math.cos(angle)*(55+i%3*25),vy:Math.sin(angle)*(55+i%3*25)-30,color,age:0,size:2+i%3});}
    particles=particles.slice(-90);
  }
  function notify(text,color) { banner={text,color,age:0}; }
  function advanceFeedback(dt) {
    sceneTime+=dt;paddleFlash=Math.max(0,paddleFlash-dt);
    for(const p of particles){p.age+=dt;p.x+=p.vx*dt;p.vy+=150*dt;p.y+=p.vy*dt;}particles=particles.filter(p=>p.age<.55);
    for(const r of rings)r.age+=dt;rings=rings.filter(r=>r.age<.45);
    for(const p of trail)p.age+=dt;trail=trail.filter(p=>p.age<.17);
    if(banner){banner.age+=dt;if(banner.age>1.6)banner=null;}
  }
  function stepWithFeedback(dt) {
    const wasPlaying=game.status==='playing';
    if(!wasPlaying){game.step(dt);return;}
    const alive=game.bricks.filter(b=>b.alive), drops=game.drops.slice(), oldWave=game.wave, oldLives=game.lives, oldVy=game.ball.vy, oldY=game.ball.y;
    game.step(dt);
    if(game.wave>oldWave){burst(200,190,'#61f4d7',22);notify('第 '+oldWave+' 波 · 全部击破','#61f4d7');trail=[];}
    else for(const brick of alive)if(!brick.alive)burst(brick.x+brick.w/2,brick.y+brick.h/2,palette[brick.row%palette.length]);
    if(oldVy>0&&game.ball.vy<0&&oldY>game.paddle.y-45){paddleFlash=.2;burst(game.ball.x,game.paddle.y,'#61f4d7',6);}
    for(const drop of drops)if(!game.drops.includes(drop)&&drop.y<game.paddle.y+24&&game.wave===oldWave&&game.lives>=oldLives){burst(drop.x,game.paddle.y,dropColors[drop.type],12);notify({wide:'挡板加宽 · 10 秒',slow:'慢速球 · 10 秒',life:'生命 +1'}[drop.type],dropColors[drop.type]);}
    if(game.lives<oldLives){trail=[];notify(game.status==='over'?'挑战结束':'没接住 · 还有 '+game.lives+' 次机会','#ff7c94');burst(game.ball.x,500,'#ff7c94',12);}
    if(!motionQuery.matches&&game.status==='playing'&&dt>0){trail.push({x:game.ball.x,y:game.ball.y,age:0});trail=trail.slice(-16);}
  }
  try { const stored = Number(localStorage.getItem('mini-breakout-best')); if (Number.isFinite(stored) && stored > 0) best = stored; } catch (_) {}
  function sizeCanvas() { const dpr = Math.min(window.devicePixelRatio || 1, 3); canvas.width = Math.round(400 * dpr); canvas.height = Math.round(520 * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw(); }
  function pill(x,y,w,h,r,color) { ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); }
  function draw() {
    ctx.clearRect(0,0,400,520);const sky=ctx.createLinearGradient(0,0,0,520);sky.addColorStop(0,'#102b3d');sky.addColorStop(1,'#091825');ctx.fillStyle=sky;ctx.fillRect(0,0,400,520);
    const halo=ctx.createRadialGradient(200,90,0,200,90,250);halo.addColorStop(0,'#59e6ce10');halo.addColorStop(1,'#59e6ce00');ctx.fillStyle=halo;ctx.fillRect(0,0,400,520);
    ctx.fillStyle='#91dbe514';for(let i=0;i<26;i++){ctx.beginPath();ctx.arc((i*73+15)%400,(i*89+25)%520,i%4===0?1.3:.8,0,Math.PI*2);ctx.fill();}
    ctx.strokeStyle='#7ff4df1a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(10,454);ctx.lineTo(390,454);ctx.stroke();
    for(const brick of game.bricks)if(brick.alive){const color=palette[brick.row%palette.length];pill(brick.x,brick.y+3,brick.w,brick.h,5,'#00000035');ctx.shadowColor=color;ctx.shadowBlur=7;pill(brick.x,brick.y,brick.w,brick.h,5,color);ctx.shadowBlur=0;pill(brick.x+3,brick.y+2,brick.w-6,3,2,'#ffffff55');pill(brick.x+3,brick.y+brick.h-4,brick.w-6,2,1,'#00000019');}
    for(const r of rings){ctx.globalAlpha=1-r.age/.45;ctx.strokeStyle=r.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,4+r.age*60,0,Math.PI*2);ctx.stroke();}ctx.globalAlpha=1;
    for(const p of particles){ctx.globalAlpha=1-p.age/.55;pill(p.x,p.y,p.size,p.size,1,p.color);}ctx.globalAlpha=1;
    for(const drop of game.drops){const color=dropColors[drop.type],pulse=motionQuery.matches?0:Math.sin(sceneTime*6)*2;ctx.shadowColor=color;ctx.shadowBlur=14+pulse;pill(drop.x-12,drop.y-12,24,24,8,color);ctx.shadowBlur=0;pill(drop.x-9,drop.y-9,18,3,2,'#ffffff60');ctx.fillStyle='#0d2638';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText({wide:'↔',slow:'◷',life:'♥'}[drop.type],drop.x,drop.y+1);}
    ctx.shadowColor='#61f4d7';ctx.shadowBlur=paddleFlash>0?24:9;pill(game.paddle.x-game.paddle.w/2,game.paddle.y,game.paddle.w,game.paddle.h,6,paddleFlash>0?'#fff':game.wideTime>0?'#61f4d7':'#a5eefe');ctx.shadowBlur=0;pill(game.paddle.x-game.paddle.w/2+7,game.paddle.y+2,game.paddle.w-14,2,1,'#ffffff90');
    for(const p of trail){ctx.globalAlpha=(1-p.age/.17)*.38;ctx.fillStyle=game.slowTime>0?'#64d6ff':'#61f4d7';ctx.beginPath();ctx.arc(p.x,p.y,game.ball.r*(1-p.age/.25),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;
    ctx.shadowColor=game.slowTime>0?'#64d6ff':'#fff';ctx.shadowBlur=14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(game.ball.x,game.ball.y,game.ball.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.textBaseline='alphabetic';ctx.font='700 10px system-ui';ctx.fillStyle='#8cb8c8';ctx.textAlign='left';ctx.fillText('BREAKOUT',18,26);ctx.textAlign='right';ctx.fillStyle='#61f4d7';ctx.fillText('WAVE '+String(game.wave).padStart(2,'0'),382,26);
    const effects=[];if(game.wideTime>0)effects.push({text:'↔ '+Math.ceil(game.wideTime)+'s',color:'#61f4d7'});if(game.slowTime>0)effects.push({text:'◷ '+Math.ceil(game.slowTime)+'s',color:'#64d6ff'});effects.forEach((effect,i)=>{pill(16+i*75,425,68,20,7,'#0c2638');ctx.font='bold 11px system-ui';ctx.fillStyle=effect.color;ctx.textAlign='center';ctx.fillText(effect.text,50+i*75,439);});
    if(banner){ctx.globalAlpha=Math.min(1,(1.6-banner.age)*3);pill(52,360,296,36,12,'#112f42f0');ctx.fillStyle=banner.color;ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(banner.text,200,383);ctx.globalAlpha=1;}
  }
  function updateUI() {
    $('score').textContent=game.score;$('lives').textContent=game.lives;$('wave').textContent=game.wave;
    if(game.score>best){best=game.score;if(best!==savedScore){try{localStorage.setItem('mini-breakout-best',String(best));}catch(_){}savedScore=best;}}
    $('best').textContent=best;$('launch').disabled=game.status!=='ready';$('pause').disabled=!['playing','paused'].includes(game.status);$('pause').textContent=game.status==='paused'?'继续':'暂停';
    $('overlay').hidden=game.status==='playing';
    const messages={ready:[game.wave===1&&game.score===0?'准备发球':game.wave>1&&game.bricks.every(b=>b.alive)?'砖墙击破！':'准备下一球',game.wave>1&&game.bricks.every(b=>b.alive)?'第 '+game.wave+' 波已就位 · 点击「发球」继续':'先移动挡板找到位置，点击「发球」开始'],paused:['已暂停','点击「继续」回到游戏'],over:['挑战结束','获得 '+game.score+' 分 · 点击「重新开始」再挑战']};
    if(messages[game.status]){$('overlay-title').textContent=messages[game.status][0];$('overlay-detail').textContent=messages[game.status][1];}
    const effects=[];if(game.wideTime>0)effects.push('加宽 '+Math.ceil(game.wideTime)+'s');if(game.slowTime>0)effects.push('慢速 '+Math.ceil(game.slowTime)+'s');
    const text='第 '+game.wave+' 波 · '+({ready:'准备发球',playing:'进行中',paused:'已暂停',over:'本局结束'}[game.status])+(effects.length?' · '+effects.join(' / '):'');
    if(text!==shownStatus){$('status').textContent=text;shownStatus=text;}
  }
  function act(action) { keys.clear(); action(); if(game.status==='paused'||(game.status==='ready'&&game.score===0))clearFeedback(); if(game.status==='playing')canvas.focus({preventScroll:true}); lastTime=0; updateUI(); draw(); }
  $('launch').addEventListener('click',()=>act(()=>game.launch()));
  $('pause').addEventListener('click',()=>act(()=>game.status==='paused'?game.resume():game.pause()));
  $('restart').addEventListener('click',()=>act(()=>game.restart()));
  function formTarget(target) { return target instanceof Element && !!target.closest('button,input,select,textarea,[contenteditable="true"]'); }
  window.addEventListener('keydown',event=>{if(formTarget(event.target))return;const key=event.key.toLowerCase();if(['arrowleft','arrowright','a','d',' '].includes(key)){event.preventDefault();if(key===' '){if(!event.repeat)act(()=>{if(game.status==='ready')game.launch();else if(game.status==='paused')game.resume();else game.pause();});}else keys.add(key);}});
  window.addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));
  function point(event) { const rect=canvas.getBoundingClientRect(); game.movePaddle((event.clientX-rect.left)*400/rect.width); draw(); }
  canvas.addEventListener('pointerdown',event=>{if(event.button!==0)return;pointerId=event.pointerId;canvas.setPointerCapture(pointerId);canvas.focus({preventScroll:true});point(event);event.preventDefault();});
  canvas.addEventListener('pointermove',event=>{if(event.pointerId===pointerId)point(event);});
  const release=event=>{if(event.pointerId===pointerId)pointerId=null;};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
  function pauseAway(){keys.clear();pointerId=null;game.pause();clearFeedback();lastTime=0;updateUI();draw();}
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAway();});window.addEventListener('blur',pauseAway);window.addEventListener('resize',sizeCanvas);
  function frame(time){const dt=lastTime?Math.min((time-lastTime)/1000,0.05):0;lastTime=time;if(!document.hidden){if(game.status==='playing'||game.status==='ready'){const direction=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);if(direction)game.movePaddle(game.paddle.x+direction*390*dt);}if(game.status!=='paused')advanceFeedback(dt);stepWithFeedback(dt);draw();updateUI();}requestAnimationFrame(frame);}
  sizeCanvas();updateUI();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
